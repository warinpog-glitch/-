<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลังข้อสอบ Manso</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: var(--primary);
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .search-box {
      width: 100%;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .exam-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .exam-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .exam-card:hover, .exam-card:active {
      background: var(--card-hover);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .exam-info h2 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .exam-info p {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .arrow {
      font-size: 1.2rem;
      color: var(--primary);
      font-weight: bold;
    }

    .loading {
      text-align: center;
      color: var(--text-sub);
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📚 คลังข้อสอบ</h1>
      <p>เลือกชุดข้อสอบที่ต้องการฝึกทำด้านล่าง</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 ค้นหาชุดข้อสอบ..." onkeyup="filterExams()">
    </div>

    <div class="exam-grid" id="examList">
      <div class="loading" id="loadingText">กำลังโหลดรายการข้อสอบ...</div>
    </div>
  </div>

  <script>
    // ตั้งค่าข้อมูลโปรเจกต์ของคุณ
    const USERNAME = 'warinpog-glitch';
    const REPO = 'Manso';

    async function loadExams() {
      const container = document.getElementById('examList');
      const loading = document.getElementById('loadingText');

      try {
        // ดึงรายการไฟล์ใน Repository ผ่าน GitHub API
        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/?t=${new Date().getTime()}`);

        const files = await res.json();

        // กรองเฉพาะไฟล์ .html และยกเว้น index.html
        const examFiles = files.filter(file => 
          file.name.endsWith('.html') && file.name.toLowerCase() !== 'index.html'
        );

        loading.remove();

        if (examFiles.length === 0) {
          container.innerHTML = '<div class="loading">ยังไม่พบไฟล์ข้อสอบ (.html)</div>';
          return;
        }

        // นำไฟล์ที่เจอมาสร้างเป็นปุ่มข้อสอบ
        examFiles.forEach(file => {
          // ตัดนามสกุล .html ออกเพื่อนำมาแสดงเป็นชื่อหัวข้อ
          const title = file.name.replace(/\.html$/i, '');
          
          const card = document.createElement('a');
          card.href = file.name;
          card.className = 'exam-card';
          card.innerHTML = `
            <div class="exam-info">
              <h2>📝 ${title}</h2>
              <p>ไฟล์: ${file.name}</p>
            </div>
            <span class="arrow">→</span>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        loading.innerText = 'เกิดข้อผิดพลาดในการโหลดรายการข้อสอบ';
        console.error(err);
      }
    }

    function filterExams() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.exam-card');
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? 'flex' : 'none';
      });
    }

    loadExams();
  </script>

</body>
</html>
