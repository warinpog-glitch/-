<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manso Comprehensive Final (200 ข้อ - Auto-Save & Resume)</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --primary: #007aff;
      --primary-tint: #e5f1ff;
      --success: #34c759;
      --success-tint: #e8f9ed;
      --danger: #ff3b30;
      --danger-tint: #ffebe9;
      --text: #1c1c1e;
      --subtext: #8e8e93;
      --border: #d1d1d6;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Sarabun", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* แถบด้านข้าง Sidebar */
    aside.sidebar {
      width: 330px;
      background: rgba(255, 255, 255, 0.95);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .sidebar-header p {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-top: 2px;
    }

    .cat-selector {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .cat-btn {
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--subtext);
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .cat-btn.active {
      background: var(--primary-tint);
      color: var(--primary);
      border-color: var(--primary);
    }

    .grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      align-content: start;
    }

    .grid-item {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--subtext);
      cursor: pointer;
      transition: transform 0.1s, background-color 0.15s;
    }

    .grid-item:active {
      transform: scale(0.95);
    }

    .grid-item.active {
      border: 2px solid var(--primary);
      color: var(--primary);
      background: var(--primary-tint);
    }

    .grid-item.correct {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }

    .grid-item.wrong {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    /* พื้นที่แสดงโจทย์หลัก */
    main.main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }

    .top-bar {
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .stats-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #e5e5ea;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .stats-badge span b {
      color: var(--primary);
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .quiz-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .quiz-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 780px;
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      margin-bottom: auto;
    }

    .category-tag {
      align-self: flex-start;
      background: var(--primary-tint);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
      color: var(--text);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      padding: 16px 18px;
      background: var(--bg);
      border: 1.5px solid transparent;
      border-radius: var(--radius-md);
      font-size: 0.98rem;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: #e5e5ea;
    }

    .option-btn.selected-correct {
      background: var(--success-tint);
      border-color: var(--success);
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.selected-wrong {
      background: var(--danger-tint);
      border-color: var(--danger);
      color: #7f1d1d;
      font-weight: 600;
    }

    .explanation-box {
      margin-top: 24px;
      padding: 18px;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      line-height: 1.55;
      display: none;
      animation: popIn 0.2s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .explanation-box.correct {
      background: var(--success-tint);
      color: #14532d;
      border: 1px solid #86efac;
    }

    .explanation-box.wrong {
      background: var(--danger-tint);
      color: #7f1d1d;
      border: 1px solid #fca5a5;
    }

    .bottom-bar {
      height: 68px;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.9);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-btn {
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-prev {
      background: #e5e5ea;
      color: var(--text);
    }

    .btn-next {
      background: var(--primary);
      color: white;
    }

    .nav-btn:active {
      opacity: 0.8;
    }

    @media (max-width: 820px) {
      aside.sidebar { display: none; }
      .quiz-card { padding: 20px; }
      .quiz-viewport { padding: 16px; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Manso Comprehensive Final</h2>
      <p>ระบบบันทึกความคืบหน้าอัตโนมัติ (Auto-Save)</p>
    </div>

    <div class="cat-selector">
      <button class="cat-btn active" id="btn_cat_all" onclick="switchCategory('all', this)">
        <span>ข้อสอบทั้งหมด</span>
        <span>200 ข้อ</span>
      </button>
      <button class="cat-btn" id="btn_cat_1" onclick="switchCategory('W8_ชีวิตและธรรมชาติ', this)">
        <span>1. W8 ชีวิตและธรรมชาติ</span>
        <span>ข้อ 1-40</span>
      </button>
      <button class="cat-btn" id="btn_cat_2" onclick="switchCategory('W9_ระบบนิเวศ', this)">
        <span>2. W9 ระบบนิเวศ</span>
        <span>ข้อ 41-80</span>
      </button>
      <button class="cat-btn" id="btn_cat_3" onclick="switchCategory('W10_ฟื้นฟูธรรมชาติ', this)">
        <span>3. W10 ฟื้นฟูธรรมชาติ</span>
        <span>ข้อ 81-120</span>
      </button>
      <button class="cat-btn" id="btn_cat_4" onclick="switchCategory('ความยุติธรรมกับสิ่งแวดล้อม', this)">
        <span>4. ความยุติธรรมกับสิ่งแวดล้อม</span>
        <span>ข้อ 121-160</span>
      </button>
      <button class="cat-btn" id="btn_cat_5" onclick="switchCategory('เศรษฐกิจพอเพียง', this)">
        <span>5. เศรษฐกิจพอเพียงฯ</span>
        <span>ข้อ 161-200</span>
      </button>
    </div>

    <div class="grid-container" id="gridNav"></div>
  </aside>

  <main class="main-view">
    <div class="top-bar">
      <div class="stats-badge">
        <span>ข้อที่ <b id="currentIdxText">1</b>/200</span>
        <span>คะแนน <b id="scoreNumText">0</b></span>
      </div>
      <button class="reset-btn" onclick="resetProgress()">ล้างคำตอบ</button>
    </div>

    <div class="quiz-viewport">
      <div class="quiz-card">
        <div class="category-tag" id="categoryBadge">บทเรียน</div>
        <div class="question-title" id="questionTitle">กำลังโหลดข้อสอบ...</div>
        <div class="options-list" id="optionsContainer"></div>
        <div class="explanation-box" id="explanationBox"></div>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="nav-btn btn-prev" onclick="changeQuestion(-1)">‹ ข้อก่อนหน้า</button>
      <button class="nav-btn btn-next" onclick="changeQuestion(1)">ข้อถัดไป ›</button>
    </div>
  </main>

  <script>
    const questions = [
      // หมวดที่ 1: W8_ชีวิตและธรรมชาติ (1-40)
      { id: 1, cat: "W8_ชีวิตและธรรมชาติ", q: "หากนักศึกษาทำการสำรวจระบบนิเวศบริเวณอ่างเก็บน้ำสุรนารี ข้อใดจัดเป็นปัจจัยทางชีวภาพ (Biotic factor) ทั้งหมด", opts: ["ก. อุณหภูมิของน้ำ, แสงแดด, ปลานิล", "ข. นกยาง, ปลานิล, แบคทีเรียย่อยสลาย", "ค. ค่าความเป็นกรด-ด่างของดิน, ความชื้น, ต้นนนทรี", "ง. แร่ธาตุในน้ำ, แก๊สออกซิเจน, สาหร่ายหางกระรอก"], ans: "ข", exp: "ปัจจัยทางชีวภาพ (Biotic factor) หมายถึง สิ่งมีชีวิตทั้งหมดที่เป็นองค์ประกอบในระบบนิเวศ ส่วนอุณหภูมิ แสง ความชื้น แร่ธาตุ และแก๊ส จัดเป็นปัจจัยทางกายภาพ (Abiotic factor)" },
      { id: 2, cat: "W8_ชีวิตและธรรมชาติ", q: "การศึกษาขอบเขตของนิเวศวิทยา (Ecology) ครอบคลุมระดับโครงสร้างตั้งแต่ระดับใดถึงระดับใด", opts: ["ก. ระดับเซลล์ ถึง ระดับระบบอวัยวะ", "ข. ระดับประชากร ถึง ระดับระบบนิเวศ", "ค. ระดับสิ่งมีชีวิตแต่ละตัว ถึง ระดับชีวาลัย", "ง. ระดับโมเลกุล ถึง ระดับชุมชีพ"], ans: "ค", exp: "ขอบเขตของนิเวศวิทยาขยายตั้งแต่ระดับตัวสิ่งมีชีวิต (Individual organism), ประชากร (Population), ชุมชีพ (Community), ระบบนิเวศ (Ecosystem) จนถึงระดับชีวาลัย (Biosphere)" },
      { id: 3, cat: "W8_ชีวิตและธรรมชาติ", q: "ข้อใดกล่าวถึงอัตราการสูญพันธุ์ของสิ่งมีชีวิตบนโลกในปัจจุบันได้ถูกต้องตามข้อมูลในบทเรียน", opts: ["ก. ช้ากว่าอัตราตามธรรมชาติเนื่องจากการอนุรักษ์", "ข. เท่ากับอัตราการเกิดใหม่ของสิ่งมีชีวิตชนิดใหม่", "ค. เร็วกว่าปกติประมาณ 1,000 เท่า จากกิจกรรมของมนุษย์", "ง. เร็วกว่าปกติประมาณ 10 เท่า จากการเปลี่ยนแปลงของดวงอาทิตย์"], ans: "ค", exp: "ข้อมูลในสไลด์ระบุชัดเจนว่า ปัจจุบันอัตราการสูญพันธุ์ของสิ่งมีชีวิตบนโลกเกิดเร็วกว่าปกติถึง 1,000 เท่า โดยมีสาเหตุหลักมาจากกิจกรรมและการกระทำของมนุษย์" },
      { id: 4, cat: "W8_ชีวิตและธรรมชาติ", q: "รายงานวิจัยจากมหาวิทยาลัยเคมบริจด์ (2021) ตีพิมพ์ในวารสาร Frontiers in Forests and Global Change ระบุว่าโลกเหลือพื้นที่ที่มีสภาพทางนิเวศวิทยาที่สมบูรณ์ดั้งเดิมอยู่เท่าใด", opts: ["ก. ประมาณ 3%", "ข. ประมาณ 15%", "ค. ประมาณ 30%", "ง. ประมาณ 50%"], ans: "ก", exp: "ผลการศึกษาจากมหาวิทยาลัยเคมบริดจ์ (2021) พบว่าโลกเหลือพื้นที่ที่ยังคงมีสภาพทางนิเวศวิทยาที่สมบูรณ์ดั้งเดิมและไม่ถูกมนุษย์รบกวนเพียงแค่ 3% เท่านั้น" },
      { id: 5, cat: "W8_ชีวิตและธรรมชาติ", q: "คำว่า 'ยุคโลกเดือด (Global Boiling)' ที่องค์การสหประชาชาติ (UN) ประกาศเตือน สะท้อนความเปลี่ยนแปลงใด", opts: ["ก. การเพิ่มขึ้นของภูเขาไฟใต้น้ำทั่วโลก", "ข. การสิ้นสุดยุคโลกร้อนเข้าสู่วิกฤตสภาพภูมิอากาศที่รุนแรงยิ่งขึ้น", "ค. การหมุนเวียนของกระแสน้ำอุ่นในมหาสมุทรหยุดลง", "ง. การเกิดปรากฏการณ์ไมโครพลาสติกปนเปื้อนในแหล่งน้ำ"], ans: "ข", exp: "UN ประกาศเตือนว่า 'ยุคโลกร้อน (Global Warming) ได้สิ้นสุดลงแล้ว และโลกกำลังเข้าสู่ยุคโลกเดือด (Global Boiling)' เพื่อเตือนถึงสภาวะอุณหภูมิโลกที่พุ่งสูงและภาวะรวนของสภาพภูมิอากาศที่ขั้นวิกฤต" },
      { id: 6, cat: "W8_ชีวิตและธรรมชาติ", q: "การจัดระดับโครงสร้างของสิ่งมีชีวิต ข้อใดเรียงลำดับจากระดับที่เล็กที่สุดไปใหญ่ที่สุดได้ถูกต้อง", opts: ["ก. เซลล์ → เนื้อเยื่อ → อวัยวะ → ระบบอวัยวะ → สิ่งมีชีวิต", "ข. อะตอม → เซลล์ → โมเลกุล → เนื้อเยื่อ → อวัยวะ", "ค. เนื้อเยื่อ → เซลล์ → ระบบอวัยวะ → อวัยวะ → สิ่งมีชีวิต", "ง. เซลล์ → อวัยวะ → เนื้อเยื่อ → สิ่งมีชีวิต → ประชากร"], ans: "ก", exp: "ลำดับโครงสร้างทางชีววิทยาเริ่มจาก อะตอม → โมเลกุล → เซลล์ → เนื้อเยื่อ → อวัยวะ → ระบบอวัยวะ → สิ่งมีชีวิตหลายเซลล์" },
      { id: 7, cat: "W8_ชีวิตและธรรมชาติ", q: "แนวคิดเรื่อง 'คุณสมบัติเกิดใหม่ (Emergent properties)' ในทางชีววิทยาหมายความว่าอย่างไร", opts: ["ก. คุณสมบัติของสารเคมีที่ย่อยสลายได้เองตามธรรมชาติ", "ข. คุณสมบัติใหม่ที่เกิดขึ้นเมื่อองค์ประกอบย่อยมารวมกันเป็นระบบ", "ค. คุณสมบัติการปรับตัวของสิ่งมีชีวิตเพื่อการกลายพันธุ์", "ง. คุณสมบัติในการสืบพันธุ์แบบไม่ใช้อาศัยเพศของสิ่งมีชีวิตเซลล์เดียว"], ans: "ข", exp: "Emergent properties คือคุณสมบัติใหม่ที่ซับซ้อนขึ้น ซึ่งไม่พบในองค์ประกอบย่อยเดี่ยวๆ แต่เกิดขึ้นจากการปฏิสัมพันธ์กันขององค์ประกอบย่อยเมื่อถูกจัดระบบเข้าด้วยกัน" },
      { id: 8, cat: "W8_ชีวิตและธรรมชาติ", q: "องค์ประกอบใดต่อไปนี้จัดเป็น 'โมเลกุลแห่งชีวิต (Molecules of life)' ที่พบเฉพาะในสิ่งมีชีวิต", opts: ["ก. น้ำ, แก๊สคาร์บอนไดออกไซด์, เกลือแร่", "ข. คาร์โบไฮเดรต, ไขมัน, โปรตีน, กรดนิวคลีอิก", "ค. ซิลิคอน, เหล็ก, ทองแดง, แคลเซียม", "ง. อะตอมของไฮโดรเจน, อะตอมของออกซิเจน"], ans: "ข", exp: "โมเลกุลแห่งชีวิต ได้แก่ สารอินทรีย์ขนาดใหญ่ 4 กลุ่ม คือ คาร์โบไฮเดรต ไขมัน โปรตีน และกรดนิวคลีอิก (DNA/RNA) ซึ่งทำหน้าที่เป็นองค์ประกอบและขับเคลื่อนกระบวนการของชีวิต" },
      { id: 9, cat: "W8_ชีวิตและธรรมชาติ", q: "ข้อใดคือหน่วยที่เล็กที่สุดของสิ่งมีชีวิตที่สามารถดำรงชีวิต ดำเนินกระบวนการเมแทบอลิซึม และสืบพันธุ์ได้ด้วยตนเอง", opts: ["ก. อะตอม", "ข. DNA", "ค. เซลล์", "ง. เนื้อเยื่อ"], ans: "ค", exp: "เซลล์ (Cell) คือหน่วยพื้นฐานที่เล็กที่สุดของสิ่งมีชีวิต สามารถมีชีวิต ดำรงชีวิต และสืบพันธุ์ได้ด้วยตนเอง (สำหรับสิ่งมีชีวิตเซลล์เดียว)" },
      { id: 10, cat: "W8_ชีวิตและธรรมชาติ", q: "ฝูงเพนกวินจักรพรรดิที่อาศัยอยู่ร่วมกันบนลานน้ำแข็งแอนตาร์กติกา จัดเป็นลำดับโครงสร้างทางนิเวศวิทยาในระดับใด", opts: ["ก. ชุมชีพ (Community)", "ข. ประชากร (Population)", "ค. ระบบนิเวศ (Ecosystem)", "ง. ชีวาลัย (Biosphere)"], ans: "ข", exp: "ประชากร (Population) หมายถึง กลุ่มของสิ่งมีชีวิต 'ชนิดเดียวกัน' ที่อาศัยอยู่ร่วมกันในพื้นที่เดียวกัน ณ ช่วงเวลาหนึ่ง" },
      { id: 11, cat: "W8_ชีวิตและธรรมชาติ", q: "ข้อแตกต่างสำคัญระหว่าง 'ชุมชีพ (Community)' และ 'ระบบนิเวศ (Ecosystem)' คืออะไร", opts: ["ก. ชุมชีพรวมสิ่งไม่มีชีวิตด้วย แต่ระบบนิเวศมีเฉพาะสิ่งมีชีวิต", "ข. ระบบนิเวศรวมปัจจัยทางกายภาพและการถ่ายเทพลังงาน ส่วนชุมชีพเน้นเฉพาะกลุ่มสิ่งมีชีวิต", "ค. ชุมชีพมีขนาดใหญ่กว่าระบบนิเวศเสมอ", "ง. ชุมชีพประกอบด้วยสิ่งมีชีวิตชนิดเดียว แต่ระบบนิเวศมีหลายชนิด"], ans: "ข", exp: "ชุมชีพ (Community) คือประชากรของสิ่งมีชีวิตทุกชนิดในพื้นที่หนึ่ง ส่วนระบบนิเวศ (Ecosystem) รวมการมีปฏิสัมพันธ์ระหว่างชุมชีพนั้นกับสิ่งแวดล้อมทางกายภาพและเคมี รวมถึงการถ่ายเทพลังงานและหมุนเวียนสาร" },
      { id: 12, cat: "W8_ชีวิตและธรรมชาติ", q: "ข้อใดจัดเป็นองค์ประกอบของ 'เอกภาพของชีวิต (Unity of life)' ที่สิ่งมีชีวิตทุกชนิดบนโลกมีร่วมกัน", opts: ["ก. ต้องการพลังงาน ตอบสนองต่อสิ่งเร้า และใช้ DNA เป็นสารพันธุกรรม", "ข. สามารถสังเคราะห์แสงได้ มีระบบประสาท และมีปอดสำหรับหายใจ", "ค. มีหัวใจสูบฉีดเลือด สามารถเคลื่อนที่ได้ และมีกระดูกสันหลัง", "ง. มีโครงสร้างเซลล์แบบยูแคริโอต มีใบ มีราก และสร้างเมล็ดได้"], ans: "ก", exp: "เอกภาพของชีวิต คือลักษณะร่วมพื้นฐานของสิ่งมีชีวิตทุกชนิด ได้แก่ การต้องการพลังงานและวัตถุดิบ การรับรู้และตอบสนองต่อสิ่งแวดล้อม และการมี DNA ถ่ายทอดลักษณะพันธุกรรม" },
      { id: 13, cat: "W8_ชีวิตและธรรมชาติ", q: "เมื่อมนุษย์รับประทานอาหาร ระดับน้ำตาลในเลือดจะสูงขึ้น ร่างกายจึงกระตุ้นการหลั่งอินซูลินเพื่อนำกลูโคสเข้าสู่เซลล์จนระดับน้ำตาลกลับสู่ภาวะปกติ ปรากฏการณ์นี้เรียกว่าอะไร", opts: ["ก. การปรับตัวทางวิวัฒนาการ (Evolutionary adaptation)", "ข. ภาวะธำรงดุล (Homeostasis)", "ค. กระบวนการเปลี่ยนแปลงแทนที่ (Succession)", "ง. การเกิดคุณสมบัติเกิดใหม่ (Emergent property)"], ans: "ข", exp: "ภาวะธำรงดุล (Homeostasis) คือ กระบวนการรักษาสภาวะแวดล้อมภายในร่างกายของสิ่งมีชีวิตให้อยู่ในเกณฑ์คงที่และเหมาะสมต่อการทำงานของเซลล์" },
      { id: 14, cat: "W8_ชีวิตและธรรมชาติ", q: "ข้อใดอธิบายทิศทางการไหลของพลังงาน (Energy flow) และการหมุนเวียนสารอาหาร (Nutrient cycling) ในระบบนิเวศได้ถูกต้องที่สุด", opts: ["ก. พลังงานและสารอาหารต่างหมุนเวียนเป็นวัฏจักรไม่มีสิ้นสุด", "ข. พลังงานไหลในทิศทางเดียวและสูญเสียเป็นความร้อน ส่วนสารอาหารเกิดการหมุนเวียนวนกลับมาใช้ใหม่", "ค. พลังงานถ่ายทอดจากผู้บริโภคไปผู้ผลิต ส่วนสารอาหารไหลทิศทางเดียว", "ง. พลังงานและสารอาหารต่างไหลทิศทางเดียวและสูญหายไปจากระบบนิเวศ"], ans: "ข", exp: "พลังงานเข้าสู่ระบบนิเวศจากดวงอาทิตย์ ไหลไปตามลำดับขั้นอาหารในทิศทางเดียว (One-way flow) และปลดปล่อยออกสู่สิ่งแวดล้อมในรูปความร้อน ส่วนสารอาหารจะหมุนเวียน (Cycle)" },
      { id: 15, cat: "W8_ชีวิตและธรรมชาติ", q: "สิ่งมีชีวิตกลุ่มใดทำหน้าที่เปลี่ยนพลังงานแสงอาทิตย์ให้มาอยู่ในรูปพลังงานเคมีในระบบนิเวศ", opts: ["ก. ผู้ย่อยสลาย (Decomposer)", "ข. ผู้บริโภคปฐมภูมิ (Primary consumer)", "ค. ผู้ผลิต (Producer)", "ง. สัตว์กินซาก (Scavenger)"], ans: "ค", exp: "ผู้ผลิต (เช่น พืช สาหร่าย แบคทีเรียสังเคราะห์แสง) ตรึงพลังงานแสงอาทิตย์มาเปลี่ยนเป็นพลังงานเคมีในพันธะของสารอาหารผ่านกระบวนการสังเคราะห์ด้วยแสง" },
      { id: 16, cat: "W8_ชีวิตและธรรมชาติ", q: "ความแตกต่างระหว่างกระบวนการ 'การเจริญเติบโต (Growth)' และ 'การพัฒนา (Development)' ตามหลักชีววิทยาคือข้อใด", opts: ["ก. Growth คือการเปลี่ยนแปลงรูปทรง ส่วน Development คือการขยายขนาดเซลล์", "ข. Growth คือการเพิ่มขนาดและจำนวนเซลล์ ส่วน Development คือการเปลี่ยนแปลงรูปทรงและหน้าที่ของเซลล์จนโตเต็มวัย", "ค. Growth เกิดเฉพาะในพืช ส่วน Development เกิดเฉพาะในสัตว์", "ง. Growth คือการถ่ายทอด DNA ส่วน Development คือการสะสมพลังงาน"], ans: "ข", exp: "การเจริญเติบโต (Growth) เน้นการเพิ่มจำนวน ปริมาตร และขนาดของเซลล์ ส่วนการพัฒนา (Development) เน้นกระบวนการเปลี่ยนแปลงโครงสร้างและหน้าที่ของเซลล์จากตัวอ่อนไปสู่ตัวเต็มวัย" },
      { id: 17, cat: "W8_ชีวิตและธรรมชาติ", q: "เกณฑ์สำคัญขั้นแรกที่นักชีววิทยาใช้ในการแบ่งสิ่งมีชีวิตออกเป็นกลุ่ม Prokaryotes และ Eukaryotes คืออะไร", opts: ["ก. การเคลื่อนที่ได้หรือไม่ได้", "ข. การสร้างอาหารเองได้หรือไม่ได้", "ค. การมีหรือไม่มีเยื่อหุ้มนิวเคลียสห่อหุ้มสารพันธุกรรม", "ง. จำนวนเซลล์ว่าเป็นเซลล์เดียวหรือหลายเซลล์"], ans: "ค", exp: "Prokaryotes คือสิ่งมีชีวิตที่ไม่มีเยื่อหุ้มนิวเคลียส (DNA อยู่ในไซโทพลาซึม) ส่วน Eukaryotes มีเยื่อหุ้มนิวเคลียสห่อหุ้มสารพันธุกรรมอย่างชัดเจน" },
      { id: 18, cat: "W8_ชีวิตและธรรมชาติ", q: "สิ่งมีชีวิตกลุ่มใดจัดเป็นสิ่งมีชีวิตเซลล์เดียวที่ไม่มีเยื่อหุ้มนิวเคลียส (Prokaryotes)", opts: ["ก. ยูกลีนา และ ไดอะตอม", "ข. แบคทีเรีย และ อาร์เคีย", "ค. เห็ด และ รา", "ง. โพรโทซัว และ สาหร่ายสีเขียว"], ans: "ข", exp: "แบคทีเรีย (Bacteria) และ อาร์เคีย (Archaea) จัดเป็นสิ่งมีชีวิตในกลุ่มโพรแคริโอต (Prokaryotes) ทั้งหมด" },
      { id: 19, cat: "W8_ชีวิตและธรรมชาติ", q: "อาร์เคีย (Archaea) มีความโดดเด่นและแตกต่างจากแบคทีเรียทั่วไปอย่างไร", opts: ["ก. อาร์เคียเป็นสิ่งมีชีวิตหลายเซลล์ที่มีเยื่อหุ้มนิวเคลียส", "ข. มักอาศัยในสิ่งแวดล้อมสุดขั้วและมีความใกล้ชิดทางวิวัฒนาการกับยูแคริโอตมากกว่า", "ค. อาร์เคียทุกชนิดต้องใช้แสงอาทิตย์ในการสังเคราะห์อาหาร", "ง. อาร์เคียเป็นสาเหตุหลักของการเกิดโรคระบาดในมนุษย์"], ans: "ข", exp: "อาร์เคียสามารถเจริญในสภาพแวดล้อมสุดขั้ว (Extreme environments) เช่น น้ำร้อนจัด ความเค็มสูง หรือกรดจัด และมีลำดับสารพันธุกรรมใกล้ชิดกับยูแคริโอตมากกว่าแบคทีเรีย" },
      { id: 20, cat: "W8_ชีวิตและธรรมชาติ", q: "เหตุใดเห็ดและรา (Fungi) จึงมีความสำคัญอย่างยิ่งต่อความเสถียรของระบบนิเวศ", opts: ["ก. เป็นผู้ผลิตปฐมภูมิสร้างแก๊สออกซิเจนให้ระบบนิเวศ", "ข. ทำหน้าที่เป็นผู้ย่อยสลายสารอินทรีย์รีไซเคิลธาตุอาหารคืนสู่ดิน", "ค. ควบคุมประชากรผู้ล่าชั้นบนสุด", "ง. ทำหน้าที่ตรึงแก๊สไนโตรเจนจากอากาศโดยตรง"], ans: "ข", exp: "เห็ดราเป็นผู้ย่อยสลาย (Decomposer) ย่อยสลายซากสิ่งมีชีวิตและกำจัดของเสีย เปลี่ยนสารอินทรีย์ซับซ้อนให้กลายเป็นธาตุอาหารหมุนเวียนกลับสู่ผู้ผลิต" },
      { id: 21, cat: "W8_ชีวิตและธรรมชาติ", q: "ข้อใดจัดเป็นลักษณะสำคัญของพืช (Plants) ในฐานะยูแคริโอตหลายเซลล์", opts: ["ก. สังเคราะห์อาหารเองไม่ได้และเคลื่อนที่ได้รวดเร็ว", "ข. สร้างอาหารเองได้ด้วยกระบวนการสังเคราะห์ด้วยแสงและมีผนังเซลล์เป็นเซลลูโลส", "ค. มีผนังเซลล์เป็นสารไคทินและย่อยสลายอาหารภายนอกเซลล์", "ง. ไม่มีผนังเซลล์และรับประทานสิ่งมีชีวิตอื่นเป็นอาหาร"], ans: "ข", exp: "พืชเป็นผู้ผลิตปฐมภูมิหลายเซลล์ มีคลอโรฟิลล์สำหรับสังเคราะห์ด้วยแสง และมีผนังเซลล์ทำจากเซลลูโลส (Cellulose)" },
      { id: 22, cat: "W8_ชีวิตและธรรมชาติ", q: "ลักษณะเด่นร่วมกันประการหนึ่งของสัตว์ (Animals) ทุกชนิด คือข้อใด", opts: ["ก. สังเคราะห์ด้วยแสงได้ในวัยอ่อน", "ข. เป็นยูแคริโอตหลายเซลล์ที่ต้องบริโภคสิ่งมีชีวิตอื่นและไม่มีผนังเซลล์", "ค. มีผนังเซลล์เป็นเพปทิโดไกลแคน", "ง. ดำรงชีวิตเป็นผู้ย่อยสลายสารอินทรีย์เท่านั้น"], ans: "ข", exp: "สัตว์เป็นผู้บริโภคหลายเซลล์ ต้องกินเนื้อเยื่อหรือสารอาหารจากสิ่งมีชีวิตอื่น เซลล์ไม่มีผนังเซลล์ และสามารถเคลื่อนที่ได้ในระยะใดระยะหนึ่งของชีวิต" },
      { id: 23, cat: "W8_ชีวิตและธรรมชาติ", q: "ศาสตร์ที่เกี่ยวกับการจัดจำแนกสิ่งมีชีวิตออกเป็นหมวดหมู่ การตั้งชื่อ และการตรวจสอบชื่อวิทยาศาสตร์ เรียกว่าอะไร", opts: ["ก. นิเวศวิทยา (Ecology)", "ข. อนุกรมวิธาน (Taxonomy)", "ค. สรีรวิทยา (Physiology)", "ง. พันธุศาสตร์ (Genetics)"], ans: "ข", exp: "อนุกรมวิธาน (Taxonomy) คือวิชาที่ว่าด้วยการจัดจำแนก (Classification), การตั้งชื่อ (Nomenclature) และการตรวจสอบชื่อ (Identification) สิ่งมีชีวิต" },
      { id: 24, cat: "W8_ชีวิตและธรรมชาติ", q: "คาโรลัส ลินเนียส (Carolus Linnaeus) มีบทบาทสำคัญอย่างยิ่งในวงการชีววิทยาในเรื่องใด", opts: ["ก. เป็นผู้ค้นพบโครงสร้างสายเกลียวคู่ของ DNA", "ข. เป็นผู้คิดค้นระบบการตั้งชื่อวิทยาศาสตร์แบบทวินาม (Binomial nomenclature)", "ค. เป็นผู้เสนอทฤษฎีการคัดเลือกโดยธรรมชาติ", "ง. เป็นผู้ค้นพบยาปฏิชีวนะชนิดแรกของโลก"], ans: "ข", exp: "Carolus Linnaeus เป็นบิดาแห่งอนุกรมวิธานสมัยใหม่ ผู้ริเริ่มระบบการตั้งชื่อวิทยาศาสตร์แบบทวินามซึ่งยังคงใช้มาถึงปัจจุบัน" },
      { id: 25, cat: "W8_ชีวิตและธรรมชาติ", q: "ชื่อวิทยาศาสตร์ของกุหลาบด็อกโรส คือ Rosa canina คำว่า Rosa และ canina คือส่วนใดของชื่อตามลำดับ", opts: ["ก. ชื่อชนิด (Specific epithet) และ ชื่อสกุล (Genus)", "ข. ชื่อสกุล (Genus) และ ชื่อจำเพาะชนิด (Specific epithet)", "ค. ชื่อวงศ์ (Family) และ ชื่อสกุล (Genus)", "ง. ชื่อสามัญ (Common name) และ ชื่อชนิด (Specific epithet)"], ans: "ข", exp: "ชื่อวิทยาศาสตร์แบบทวินาม คำแรกคือ ชื่อสกุล (Genus) ขึ้นต้นด้วยอักษรตัวใหญ่ ส่วนคำหลังคือ ชื่อจำเพาะชนิด (Specific epithet) เขียนด้วยอักษรตัวเล็ก" },
      { id: 26, cat: "W8_ชีวิตและธรรมชาติ", q: "การลำดับหมวดหมู่สิ่งมีชีวิตจากระดับใหญ่ที่สุดไปยังระดับเล็กที่สุด ข้อใดถูกต้อง", opts: ["ก. Domain → Kingdom → Phylum → Class → Order → Family → Genus → Species", "ข. Species → Genus → Family → Order → Class → Phylum → Kingdom → Domain", "ค. Kingdom → Domain → Class → Phylum → Family → Order → Genus → Species", "ง. Domain → Phylum → Kingdom → Order → Class → Genus → Family → Species"], ans: "ก", exp: "การจัดหมวดหมู่ทางชีววิทยาเรียงจากกว้างไปแคบ: โดเมน (Domain) → อาณาจักร (Kingdom) → ไฟลัม/หมวด (Phylum/Division) → ชั้น (Class) → อันดับ (Order) → วงศ์ (Family) → สกุล (Genus) → ชนิด (Species)" },
      { id: 27, cat: "W8_ชีวิตและธรรมชาติ", q: "ข้อใด ไม่ใช่ ลักษณะที่นำมาพิจารณาจัดกลุ่มสิ่งมีชีวิตตามหลักอนุกรมวิธานทางชีววิทยา", opts: ["ก. ลักษณะทางสัณฐานวิทยา (Morphological trait)", "ข. ลักษณะทางสรีรวิทยา (Physiological trait)", "ค. ลักษณะทางพฤติกรรม (Behavioral trait)", "ง. ราคาประเมินการซื้อขายในตลาดทางเศรษฐกิจ"], ans: "ง", exp: "การจัดจำแนกสิ่งมีชีวิตจะอาศัยลักษณะทางชีววิทยา เช่น โครงสร้างสัณฐานวิทยา สรีรวิทยา พฤติกรรม และสารพันธุกรรม โดยไม่นำมูลค่าทางเศรษฐกิจมาใช้เป็นเกณฑ์" },
      { id: 28, cat: "W8_ชีวิตและธรรมชาติ", q: "เอิร์นสต์ เมเยอร์ (Ernst Mayr) ได้ให้คำจำกัดความของคำว่า 'ชนิด (Species)' ทางชีววิทยาไว้อย่างไร", opts: ["ก. สิ่งมีชีวิตที่มีสีผิวและขนาดตัวเหมือนกันทุกประการ", "ข. กลุ่มสิ่งมีชีวิตที่สามารถผสมพันธุ์กันได้ตามธรรมชาติและให้กำเนิดลูกที่ไม่เป็นหมัน", "ค. สิ่งมีชีวิตที่อาศัยอยู่ในระบบนิเวศเดียวกันและกินอาหารประเภทเดียวกัน", "ง. สิ่งมีชีวิตที่ไม่มีการกลายพันธุ์ทางพันธุกรรมเลย"], ans: "ข", exp: "Ernst Mayr เสนอแนวคิด Biological Species Concept ว่า สปีชีส์คือกลุ่มสิ่งมีชีวิตที่ผสมพันธุ์กันได้ตามธรรมชาติ ให้ลูกที่ไม่เป็นหมัน (Fertile offspring) และไม่ผสมพันธุ์กับกลุ่มอื่น" },
      { id: 29, cat: "W8_ชีวิตและธรรมชาติ", q: "จากกรณีศึกษามดคันไฟอินวิกตา (Solenopsis invicta) ที่แพร่กระจายในสหรัฐอเมริกา ข้อใดจัดเป็นการใช้ 'ชีววิธี (Biological control)' ในการควบคุมประชากรมดชนิดนี้", opts: ["ก. การฉีดพ่นสารเคมีฆ่าแมลงรุนแรงรอบรังมด", "ข. การเผาลานหญ้าบริเวณที่มีรังมดคันไฟ", "ค. การปล่อยแมลงโฟริด (Phorid fly) ซึ่งเป็นตัวเบียนตามธรรมชาติ", "ง. การนำมดคันไฟสายพันธุ์อื่นมาผสมข้ามสายพันธุ์"], ans: "ค", exp: "การใช้ชีววิธี (Biological control) คือการใช้สิ่งมีชีวิตที่เป็นศัตรูธรรมชาติ เช่น แมลงโฟริด (Phorid fly) ซึ่งเป็นตัวเบียน (Parasitoid) มาช่วยลดและควบคุมประชากรมดคันไฟอินวิกตา" },
      { id: 30, cat: "W8_ชีวิตและธรรมชาติ", q: "ปฏิสัมพันธ์ระหว่างสิ่งมีชีวิตรูปแบบใดที่ฝ่ายหนึ่งได้ประโยชน์ (+) แต่อีกฝ่ายหนึ่งไม่ได้และไม่เสียประโยชน์ (0)", opts: ["ก. ภาวะพึ่งพากัน (Mutualism)", "ข. ภาวะอิงอาศัย (Commensalism)", "ค. ภาวะปรสิต (Parasitism)", "ง. การแก่งแย่งแข่งขัน (Competition)"], ans: "ข", exp: "ภาวะอิงอาศัย หรือ เกื้อกูล (Commensalism) เป็นความสัมพันธ์แบบ (+, 0) เช่น กล้วยไม้เกาะบนต้นไม้ใหญ่ นกทำรังบนต้นไม้" },
      { id: 31, cat: "W8_ชีวิตและธรรมชาติ", q: "ความสัมพันธ์ระหว่าง 'ปลาการ์ตูนกับดอกไม้ทะเล' หรือ 'เห็ดรากับสาหร่ายในไลเคน' จัดเป็นปฏิสัมพันธ์แบบใด", opts: ["ก. ภาวะอิงอาศัย (Commensalism)", "ข. ภาวะพึ่งพา (Mutualism)", "ค. ภาวะล่าเหยื่อ (Predation)", "ง. ภาวะตัวเบียน (Parasitoidism)"], ans: "ข", exp: "ภาวะพึ่งพากัน (Mutualism) เป็นความสัมพันธ์แบบ (+, +) ที่ทั้งสองฝ่ายได้ประโยชน์ร่วมกัน และในหลายกรณีจำเป็นต้องอยู่ร่วมกันไม่สามารถแยกกันได้" },
      { id: 32, cat: "W8_ชีวิตและธรรมชาติ", q: "คำว่า 'วิถีชีวิตทางระบบนิเวศ' หรือ 'ชีพนิสัย (Ecological niche)' หมายถึงอะไร", opts: ["ก. พื้นที่ภูมิศาสตร์ทั้งหมดที่สิ่งมีชีวิตชนิดนั้นกระจายตัวอยู่", "ข. บทบาทหน้าที่และความต้องการปัจจัยทางนิเวศวิทยาเฉพาะของสิ่งมีชีวิต", "ค. อัตราการเจริญเติบโตสูงสุดของประชากรสิ่งมีชีวิต", "ง. ระยะเวลาที่สิ่งมีชีวิตใช้นอนหลับในแต่ละวัน"], ans: "ข", exp: "Ecological niche หมายถึง บทบาท หน้าที่ ความต้องการปัจจัยทางกายภาพและชีวภาพ ตลอดจนตำแหน่งทางนิเวศวิทยาที่เป็นเอกลักษณ์ของสิ่งมีชีวิตแต่ละชนิด" },
      { id: 33, cat: "W8_ชีวิตและธรรมชาติ", q: "จากการทดลองเพาะเลี้ยงสิ่งมีชีวิตเซลล์เดียวชนิด Paramecium aurelia และ Paramecium caudatum ร่วมกัน พบว่า P. aurelia สามารถแย่งชิงอาหารและขยายประชากรจนทำให้ P. caudatum ลดจำนวนลงและสูญหายไป ปรากฏการณ์นี้เรียกว่าอะไร", opts: ["ก. ภาวะอิงอาศัย (Commensalism)", "ข. การเปลี่ยนแปลงแทนที่ปฐมภูมิ (Primary succession)", "ค. การกีดกันโดยการแข่งขัน (Competitive exclusion / Exploitative competition)", "ง. ภาวะปรสิตในรัง (Brood parasitism)"], ans: "ค", exp: "เมื่อสิ่งมีชีวิตสองชนิดที่มี Ecological niche ทับซ้อนกันมาแข่งขันแย่งชิงทรัพยากรชนิดเดียวกัน ชนิดที่แข่งขันได้ดีกว่าจะขยายประชากรและกีดกันอีกชนิดหนึ่งจนสูญหายไป" },
      { id: 34, cat: "W8_ชีวิตและธรรมชาติ", q: "ความสัมพันธ์ระหว่างแมวป่าลิงซ์ (Lynx) และกระต่ายสโนว์ชู (Snowshoe hare) ในป่าเขตหนาว สะท้อนแบบแผนทางนิเวศวิทยาเรื่องใด", opts: ["ก. ประชากรผู้ล่าและเหยื่อมีความสัมพันธ์กันแบบวัฏจักรผันแปรตามกัน", "ข. ผู้ล่าจะทำให้เหยื่อสูญพันธุ์ไปจากระบบนิเวศอย่างถาวร", "ค. กระต่ายแย่งชิงอาหารจนแมวป่าลิงซ์มีจำนวนลดลง", "ง. ทั้งสองชนิดมีความสัมพันธ์แบบภาวะพึ่งพากัน (+, +)"], ans: "ก", exp: "กราฟความชุกชุมของ Lynx (ผู้ล่า) และ Snowshoe hare (เหยื่อ) มีลักษณะผันแปรขึ้นลงเป็นวัฏจักรตามกัน โดยจำนวนเหยื่อจะเป็นตัวกำหนดจำนวนผู้ล่า" },
      { id: 35, cat: "W8_ชีวิตและธรรมชาติ", q: "ข้อใด ไม่ใช่ รูปแบบการปรับตัวของพืชเพื่อป้องกันตนเองจากการถูกสัตว์กินพืช (Herbivory) ทำลาย", opts: ["ก. การสร้างหนาม (Spines / Thorns)", "ข. การสร้างสารเคมีสะสมในใบทำให้มีรสขมหรือพิษ", "ค. การพัฒนาใบให้แข็งและเคี้ยวย่อยยาก", "ง. การปล่อยสารเรียกลูกนกมาช่วยรดน้ำต้นไม้"], ans: "ง", exp: "พืชมีวิวัฒนาการป้องกันตนเอง 2 ทางหลัก คือ ทางกายภาพ (หนาม ใบแข็ง) และทางเคมี (สารพิษ รสชาติแย่) ส่วนการเรียกลูกนกรดน้ำไม่อยู่ในกลไกป้องกันตัวของพืช" },
      { id: 36, cat: "W8_ชีวิตและธรรมชาติ", q: "นกคัดคู (Cuckoo) สายพันธุ์ยุโรป มีพฤติกรรมแอบไปวางไข่ไว้ในรังของนกชนิดอื่น เพื่อให้พ่อแม่นกเจ้าของรังช่วยกกไข่และเลี้ยงดูลูกของมัน ความสัมพันธ์นี้เรียกว่าอะไร", opts: ["ก. ภาวะอิงอาศัย (Commensalism)", "ข. ปรสิตในรัง (Brood parasitism)", "ค. ตัวเบียน (Parasitoidism)", "ง. การแก่งแย่งแข่งขัน (Competition)"], ans: "ข", exp: "Brood parasitism คือภาวะที่นกบางชนิดแอบไปวางไข่ในรังของนกชนิดอื่น เพื่อผลักภาระการฟักไข่และเลี้ยงดูลูกให้แก่เจ้าเรือน" },
      { id: 37, cat: "W8_ชีวิตและธรรมชาติ", q: "ข้อแตกต่างสำคัญระหว่าง 'ปรสิต (Parasite)' และ 'ตัวเบียน (Parasitoid)' คือข้อใด", opts: ["ก. ปรสิตเป็นพืช ส่วนตัวเบียนเป็นสัตว์", "ข. ปรสิตมักไม่สังหารเจ้าเรือนทันที ส่วนตัวเบียนทำให้เจ้าเรือนตายในที่สุด", "ค. ปรสิตได้ประโยชน์ฝ่ายเดียว ส่วนตัวเบียนได้ประโยชน์ทั้งสองฝ่าย", "ง. ปรสิตอาศัยภายนอกร่างกาย ส่วนตัวเบียนอาศัยภายในร่างกายเท่านั้น"], ans: "ข", exp: "ปรสิต (Parasite) อาศัยดูดกินสารอาหารโดยพยายามไม่ให้เจ้าเรือน (Host) ตายทันที แต่ตัวเบียน (Parasitoid) เช่น แตนเบียน จะวางไข่และตัวอ่อนจะกัดกินเนื้อเยื่อเจ้าเรือนจนเจ้าเรือนตายเมื่อตัวอ่อนเจริญเต็มที่" },
      { id: 38, cat: "W8_ชีวิตและธรรมชาติ", q: "การเปลี่ยนแปลงแทนที่ทางนิเวศวิทยาที่เริ่มขึ้นในบริเวณที่ ไม่เคยมีสิ่งมีชีวิตหรือชั้นดิน อยู่ก่อนเลย เช่น บริเวณลานหินที่ธารน้ำแข็งละลายหายไป เรียกว่าอะไร", opts: ["ก. การเปลี่ยนแปลงแทนที่ปฐมภูมิ (Primary succession)", "ข. การเปลี่ยนแปลงแทนที่ทุติยภูมิ (Secondary succession)", "ค. การเปลี่ยนแปลงแบบสุ่ม (Random succession)", "ง. การเปลี่ยนแปลงแทนที่ทางเคมี (Chemical succession)"], ans: "ก", exp: "Primary succession เกิดขึ้นในพื้นที่ใหม่บริสุทธิ์ที่ไม่มีดินหรือสิ่งมีชีวิตมาก่อน เช่น ลานหิน ธารน้ำแข็งละลาย หรือลาวาภูเขาไฟเย็นตัว" },
      { id: 39, cat: "W8_ชีวิตและธรรมชาติ", q: "สิ่งมีชีวิตชนิดใดในกระบวนการเปลี่ยนแปลงแทนที่ขั้นปฐมภูมิที่ Glacier Bay รัฐอะลาสกา ทำหน้าที่เป็น 'ชนิดบุกเบิก (Pioneer species)' ที่ช่วยสร้างดินจากการตรึงไนโตรเจน", opts: ["ก. ต้นสนเฮมล็อก และ ต้นสนสปรูซ", "ข. ไลเคน มอส และพืชบุกเบิกที่มีแบคทีเรียตรึงไนโตรเจน", "ค. ต้นเอลเดอร์ และ ต้นวิลโลว์", "ง. หญ้าคา และ ไม้พุ่มขนาดใหญ่"], ans: "ข", exp: "ใน Glacier Bay สิ่งมีชีวิตบุกเบิก (Pioneer species) ได้แก่ ไลเคน มอส และพืชดอกบุกเบิก เช่น Mountain avens ซึ่งมีแบคทีเรียช่วยตรึงไนโตรเจน ย่อยสลายหินและสร้างชั้นดินอินทรีย์วัตถุแรกเริ่ม" },
      { id: 40, cat: "W8_ชีวิตและธรรมชาติ", q: "สิ่งมีชีวิตที่มีความไวต่อการเปลี่ยนแปลงหรือถูกรบกวนในธรรมชาติสูง หากสภาพแวดล้อมเสื่อมโทรมลงมันจะได้รับผลกระทบเป็นกลุ่มแรก จึงถูกใช้เป็นสัญญาณเตือนภัยทางนิเวศวิทยา มีชื่อเรียกว่าอะไร", opts: ["ก. ชนิดหลัก (Keystone species)", "ข. ชนิดบ่งชี้ (Indicator species)", "ค. ชนิดต่างถิ่น (Exotic species)", "ง. ชนิดบุกเบิก (Pioneer species)"], ans: "ข", exp: "Indicator species คือสิ่งมีชีวิตที่มีความอ่อนไหวต่อสิ่งแวดล้อมสูง หากสิ่งแวดล้อมปนเปื้อนหรือเสื่อมโทรม มันจะตายหรือลดจำนวนอย่างรวดเร็วเป็นกลุ่มแรก จึงใช้เป็นตัวดัชนีวัดความสมบูรณ์ของระบบนิเวศ" },

      // หมวดที่ 2: W9_ระบบนิเวศ (41-80)
      { id: 41, cat: "W9_ระบบนิเวศ", q: "ตามสไลด์บทเรียน ข้อใดจัดกลุ่มประเภทของทรัพยากรธรรมชาติได้ถูกต้อง", opts: ["ก. โลหะ ถ่านหิน แร่ เป็นทรัพยากรที่ใช้ไม่หมดสิ้น", "ข. พืช สัตว์ ป่าไม้ ดิน เป็นทรัพยากรที่ใช้แล้วเกิดทดแทนได้", "ค. อากาศ น้ำ และแสงอาทิตย์ เป็นทรัพยากรที่ใช้แล้วหมดไป", "ง. น้ำ ดิน และถ่านหิน เป็นทรัพยากรประเภทเดียวกันทั้งหมด"], ans: "ข", exp: "พืช สัตว์ ป่าไม้ ดิน จัดเป็นทรัพยากรธรรมชาติที่ใช้แล้วสามารถเกิดทดแทนขึ้นมาใหม่ได้" },
      { id: 42, cat: "W9_ระบบนิเวศ", q: "เหตุใด 'น้ำ' จึงถูกจัดอยู่ในกลุ่มทรัพยากรธรรมชาติที่ใช้ไม่หมดสิ้น (Non-exhausting natural resources)", opts: ["ก. เพราะน้ำบนโลกมีปริมาณเพิ่มขึ้นเรื่อยๆ จากการสังเคราะห์แสง", "ข. เพราะน้ำมีวัฏจักรหมุนเวียนเปลี่ยนสถานะกลับมาใช้อีกได้ แต่คุณภาพอาจเสื่อมลงจากมลพิษ", "ค. เพราะมนุษย์ใช้ประโยชน์จากน้ำจืดเพียง 97.41% ของน้ำทั้งหมดบนโลก", "ง. เพราะน้ำใต้ดินไม่มีวันลดลงไม่ว่าจะสูบขึ้นมาใช้มากเพียงใด"], ans: "ข", exp: "เพราะน้ำมีวัฏจักรหมุนเวียนเปลี่ยนสถานะกลับมาใช้อีกได้เรื่อยๆ แต่ปัญหาหลักคือเรื่องคุณภาพที่เสื่อมโทรมลงจากมลพิษ" },
      { id: 43, cat: "W9_ระบบนิเวศ", q: "หากพิจารณาปริมาณน้ำทั้งหมดบนโลก ปริมาณน้ำจืดที่มนุษย์สามารถนำมาใช้ประโยชน์ได้จริงในชีวิตประจำวัน มีสัดส่วนประมาณเท่าใด", opts: ["ก. ร้อยละ 97.41", "ข. ร้อยละ 2.59", "ค. ร้อยละ 1.984", "ง. ร้อยละ 0.014"], ans: "ง", exp: "น้ำจืดที่มนุษย์สามารถนำมาใช้ประโยชน์ได้จริงในชีวิตประจำวันตามแม่น้ำและทะเลสาบมีสัดส่วนเพียงประมาณร้อยละ 0.014 ของน้ำทั้งหมดบนโลก" },
      { id: 44, cat: "W9_ระบบนิเวศ", q: "ดินที่เหมาะสมต่อการเจริญเติบโตของพืช (Healthy Soil) ตามสัดส่วนมาตรฐาน ควรมีองค์ประกอบตามข้อใด", opts: ["ก. แร่ธาตุ 50%, อากาศ 20%, น้ำ 20%, อินทรียวัตถุ 10%", "ข. แร่ธาตุ 45%, อากาศ 25%, น้ำ 25%, อินทรียวัตถุ 5%", "ค. แร่ธาตุ 40%, อากาศ 30%, น้ำ 20%, อินทรียวัตถุ 10%", "ง. แร่ธาตุ 60%, อากาศ 15%, น้ำ 15%, อินทรียวัตถุ 10%"], ans: "ข", exp: "สัดส่วนมาตรฐานของดินที่ดีคือ แร่ธาตุ 45%, อากาศ 25%, น้ำ 25% และอินทรียวัตถุ 5%" },
      { id: 45, cat: "W9_ระบบนิเวศ", q: "กระบวนการสร้าง 'ดินชั้นบน' (Topsoil) ให้มีความหนาเพียง 1 นิ้ว ต้องใช้ระยะเวลานานเท่าใด", opts: ["ก. 1 ถึง 5 ปี", "ข. 10 ถึง 50 ปี", "ค. 200 ถึง 1,000 ปี", "ง. มากกว่า 10,000 ปี"], ans: "ค", exp: "การสร้างหน้าดินชั้นบนหนา 1 นิ้ว ต้องอาศัยเวลายาวนานถึง 200 ถึง 1,000 ปี" },
      { id: 46, cat: "W9_ระบบนิเวศ", q: "ชั้นหน้าตัดดิน (Soil Horizon) ชั้นใดที่มีการสะสมอินทรียวัตถุที่มาจากพืชและสัตว์ เช่น เศษใบไม้ หญ้า ที่เพิ่งเริ่มสลายตัว", opts: ["ก. O horizon", "ข. A horizon", "ค. E horizon", "ง. B horizon"], ans: "ก", exp: "O horizon (Organic horizon) เป็นชั้นดินบนสุดที่สะสมซากพืชและซากสัตว์ที่เพิ่งเริ่มสลายตัว" },
      { id: 47, cat: "W9_ระบบนิเวศ", q: "ลักษณะเด่นของชั้นชะล้าง หรือ 'E horizon' ในหน้าตัดดินคือข้อใด", opts: ["ก. เป็นชั้นที่มีสีมืดเข้มที่สุดเนื่องจากมีอินทรียวัตถุสมบูรณ์", "ข. เป็นชั้นหินแข็งที่ยังไม่มีการผุพังสลายตัว", "ค. เป็นชั้นที่มีสีซีดจาง มีอินทรียวัตถุน้อย และมีเนื้อดินหยาบกว่าชั้น B", "ง. เป็นชั้นที่เกิดการสะสมตัวของอนุภาคดินเหนียวอย่างหนาแน่น"], ans: "ค", exp: "E horizon เป็นชั้นชะล้างที่มีสีซีดจาง มีอินทรียวัตถุน้อย และมีเนื้อดินหยาบกว่าชั้น B เนื่องจากแร่ธาตุถูกน้ำชะล้างลงสู่ชั้นล่าง" },
      { id: 48, cat: "W9_ระบบนิเวศ", q: "ข้อใดกล่าวถึงความสัมพันธ์ระหว่างภูมิอากาศกับการเกิดประเภทดินได้ถูกต้อง", opts: ["ก. Aridisol เกิดในเขตทะเลทราย มีการสะสมของสาร Humus ในชั้น B หนามาก", "ข. Oxisol เกิดในเขตร้อน น้ำฝนชะล้างแร่ธาตุละลายน้ำออกหมด เหลือสารตกค้างจำพวกเหล็กและอะลูมิเนียม", "ค. Alfisol เกิดในเขตทะเลทราย ฝนตกน้อยทำให้ไม่มีชั้น O horizon", "ง. ดินในเขตทุนดราจะมีชั้น O horizon หนาที่สุดเนื่องจากพืชเจริญเติบโตรวดเร็ว"], ans: "ข", exp: "ดิน Oxisol เกิดในเขตร้อน น้ำฝนชะล้างแร่ธาตุออกไปมาก เหลือสะสมสารตกค้างจำพวกเหล็กและอะลูมิเนียมจนดินมีสีแดง" },
      { id: 49, cat: "W9_ระบบนิเวศ", q: "แก๊สชนิดใดมีปริมาณเป็นอันดับสองในองค์ประกอบของอากาศบริสุทธิ์ในบรรยากาศโลก (คิดเป็นร้อยละ 21.0)", opts: ["ก. แก๊สไนโตรเจน (N2)", "ข. แก๊สออกซิเจน (O2)", "ค. แก๊สอาร์กอน (Ar)", "ง. แก๊สคาร์บอนไดออกไซด์ (CO2)"], ans: "ข", exp: "อากาศบริสุทธิ์ประกอบด้วย ไนโตรเจนเป็นอันดับหนึ่ง (78%) และออกซิเจนเป็นอันดับสอง (21%)" },
      { id: 50, cat: "W9_ระบบนิเวศ", q: "ป่าไม้ในประเทศไทยชนิดใด จัดอยู่ในกลุ่ม 'ป่าไม่ผลัดใบ' (Evergreen Forest) ที่พบได้ในเขตร้อนที่มีปริมาณน้ำฝนเฉลี่ยมากกว่า 1,600 มิลลิเมตรต่อปี", opts: ["ก. ป่าเบญจพรรณ", "ข. ป่าเต็งรัง", "ค. ป่าดิบชื้น", "ง. ป่าชายหาด"], ans: "ค", exp: "ป่าดิบชื้นจัดเป็นป่าไม่ผลัดใบ (Evergreen Forest) ในเขตร้อนที่มีฝนตกชุกมากกว่า 1,600 มม./ปี" },
      { id: 51, cat: "W9_ระบบนิเวศ", q: "ข้อใดอธิบายความแตกต่างระหว่าง 'สภาพอากาศ' (Weather) และ 'ภูมิอากาศ' (Climate) ได้ถูกต้องที่สุด", opts: ["ก. Weather คือภาพรวมระยะยาว ส่วน Climate คือความแปรปรวนในระยะสั้น", "ข. Weather คือความแปรปรวน ณ เวลาใดเวลาหนึ่งในช่วงสั้นๆ ส่วน Climate คือภาพรวมสภาพอากาศในระยะยาว", "ค. Weather ใช้ตรวจวัดเฉพาะอุณหภูมิ ส่วน Climate ใช้ตรวจวัดเฉพาะปริมาณน้ำฝน", "ง. ทั้งสองคำมีความหมายเหมือนกันทุกประการในทางนิเวศวิทยา"], ans: "ข", exp: "Weather คือสภาพบรรยากาศในระยะเวลาสั้นๆ รายวัน ส่วน Climate คือค่าเฉลี่ยทางสถิติของสภาพอากาศในระยะยาว" },
      { id: 52, cat: "W9_ระบบนิเวศ", q: "สาเหตุสำคัญที่สุดที่ทำให้เกิด 'ฤดูกาล' ต่างๆ บนโลก และทำให้ช่วงเวลากลางวัน-กลางคืนยาวไม่เท่ากันในรอบปี คือข้อใด", opts: ["ก. ระยะห่างที่เปลี่ยนแปลงระหว่างโลกกับดวงอาทิตย์ขณะโคจร", "ข. การเอียงของแกนโลกทำมุม 23.5 องศา ขณะโคจรรอบดวงอาทิตย์", "ค. การหมุนรอบตัวเองของโลกที่ความเร็วไม่สม่ำเสมอ", "ง. การเปลี่ยนแปลงของกระแสน้ำในมหาสมุทร"], ans: "ข", exp: "การเอียงของแกนโลกทำมุม 23.5 องศาขณะโคจรรอบดวงอาทิตย์ทำให้เกิดฤดูกาลและช่วงกลางวัน-กลางคืนที่ยาวไม่เท่ากัน" },
      { id: 53, cat: "W9_ระบบนิเวศ", q: "การหมุนเวียนของบรรยากาศโลกในแต่ละซีกโลกแบ่งออกเป็น 3 เซลล์ ข้อใดเรียงลำดับละติจูดจากเส้นศูนย์สูตรไปขั้วโลกได้ถูกต้อง", opts: ["ก. Polar cell → Ferrel cell → Hadley cell", "ข. Hadley cell → Ferrel cell → Polar cell", "ค. Ferrel cell → Hadley cell → Polar cell", "ง. Hadley cell → Polar cell → Ferrel cell"], ans: "ข", exp: "3-cell model เรียงลำดับจากศูนย์สูตรไปขั้วโลกคือ Hadley cell → Ferrel cell → Polar cell" },
      { id: 54, cat: "W9_ระบบนิเวศ", q: "บริเวณละติจูด 30 องศาเหนือ และ 30 องศาใต้ ของโลก มักเป็นตำแหน่งที่ตั้งของทะเลทรายสายหลักของโลกเนื่องจากปัจจัยใด", opts: ["ก. เป็นบริเวณที่มวลอากาศอุ่นและแห้งจมตัวลงหลังจากสูญเสียความชื้นไปแล้วที่เส้นศูนย์สูตร", "ข. เป็นบริเวณที่แสงอาทิตย์ตกกระทบเป็นมุมฉากตลอดทั้งปี", "ค. เป็นบริเวณที่มีการยกตัวของมวลอากาศขึ้นอย่างรุนแรงเกิดเป็นพายุฝน", "ง. เป็นบริเวณที่มีกระแสน้ำอุ่นไหลผ่านชายฝั่งทำให้ระเหยน้ำรวดเร็ว"], ans: "ก", exp: "เป็นบริเวณที่มวลอากาศอุ่นและแห้งจมตัวลง (Subtropical High) ขัดขวางการก่อตัวของเมฆฝน ทำให้แห้งแล้งจนเกิดทะเลทราย" },
      { id: 55, cat: "W9_ระบบนิเวศ", q: "ในช่วงเดือนพฤศจิกายนถึงกุมภาพันธ์ ประเทศไทยจะได้รับอิทธิพลจากลมมรสุมชนิดใด ซึ่งนำพาความหนาวเย็นและแห้งแล้งมาจากไซบีเรีย", opts: ["ก. ลมมรสุมตะวันตกเฉียงใต้", "ข. ลมมรสุมตะวันออกเฉียงเหนือ", "ค. ลมมรสุมตะวันออกเฉียงใต้", "ง. ลมมรสุมตะวันตกเฉียงเหนือ"], ans: "ข", exp: "ลมมรสุมตะวันออกเฉียงเหนือนำพาความหนาวเย็นและแห้งแล้งมาจากประเทศจีนและไซบีเรีย" },
      { id: 56, cat: "W9_ระบบนิเวศ", q: "ปรากฏการณ์ 'เขตเงาฝน' (Rain Shadow Effect) ที่ทำให้พื้นที่ด้านหลังทิวเขากลายเป็นทะเลทราย เกิดจากกระบวนการใด", opts: ["ก. มวลอากาศชื้นลอยข้ามทิวเขาไปแล้วกลั่นตัวเป็นฝนที่ด้านหลังทิวเขา", "ข. มวลอากาศชื้นถูกพัดปะทะหน้าเขา ลอยตัวสูงขึ้นและปล่อยฝนจนหมด เมื่อข้ามมาหลังเขาจะเป็นอากาศแห้งที่จมตัวลง", "ค. แสงอาทิตย์ถูกทิวเขาบดบังทำให้ด้านหลังทิวเขาไม่มีการระเหยของน้ำ", "ง. ลมจากทะเลพัดเอาความชื้นออกจากพื้นที่ด้านหลังทิวเขาเข้าสู่มหาสมุทร"], ans: "ข", exp: "มวลอากาศชื้นยกตัวและปล่อยฝนตกจนหมดที่ด้านหน้าเขา เมื่อข้ามมาหลังเขาจึงเป็นอากาศแห้งที่จมตัวลง" },
      { id: 57, cat: "W9_ระบบนิเวศ", q: "'ละอองอากาศ' (Aerosols) เช่น ฝุ่นละออง เขม่าควัน มักสะสมตัวหนาแน่นในเขตความกดอากาศต่ำจนเกิดเป็น 'หมอกแดด' (Haze) แต่ท้องฟ้าจะกลับมาโปร่งใสได้อีกครั้งเนื่องจากปรากฏการณ์ใด", opts: ["ก. การเกิดลมพัดเข้าหาศูนย์กลางความกดอากาศต่ำ", "ข. การชะล้างละอองอากาศลงสู่พื้นดินโดยน้ำฝน", "ค. การระเหยตัวของละอองอากาศกลายเป็นแก๊สเมื่อโดนความร้อน", "ง. การดูดซับละอองอากาศโดยพืชป่าดิบชื้น"], ans: "ข", exp: "น้ำฝนช่วยชะล้างอนุภาคฝุ่นละอองและเขม่าควันในอากาศลงสู่พื้นดิน ทำให้ท้องฟ้ากลับมาแจ่มใส" },
      { id: 58, cat: "W9_ระบบนิเวศ", q: "ปัจจัยทางกายภาพหลัก 2 ประการ ที่เป็นตัวกำหนดประเภทของ 'ชีวนิเวศบก' (Terrestrial Biome) ในภูมิภาคต่างๆ ของโลก คือข้อใด", opts: ["ก. ปริมาณแก๊สออกซิเจน และ ชนิดของหินพื้นฐาน", "ข. อุณหภูมิเฉลี่ย และ ปริมาณหยาดน้ำฟ้า (ฝน) เฉลี่ยรายปี", "ค. ความสูงจากระดับน้ำทะเล และ ปริมาณสัตว์กินพืช", "ง. ความชื้นสัมพัทธ์ และ ประเภทของแมลงในพื้นที่"], ans: "ข", exp: "อุณหภูมิเฉลี่ยและปริมาณหยาดน้ำฟ้า (ฝน) เฉลี่ยรายปี เป็น 2 ปัจจัยหลักในการจำแนกประเภทชีวนิเวศบก" },
      { id: 59, cat: "W9_ระบบนิเวศ", q: "ชีวนิเวศบกประเภทใดที่มีอุณหภูมิเฉลี่ยต่ำที่สุด และมีชั้นดินเยือกแข็งคงตัว (Permafrost)", opts: ["ก. ไทกา (Taiga)", "ข. ทุนดรา (Tundra)", "ค. ป่าสนเขตอบอุ่น (Coniferous forest)", "ง. ชาพาร์รัล (Chaparral)"], ans: "ข", exp: "ทุนดรา (Tundra) เป็นชีวนิเวศที่มีอุณหภูมิเฉลี่ยต่ำที่สุดและมีชั้นดินเยือกแข็งคงตัว (Permafrost)" },
      { id: 60, cat: "W9_ระบบนิเวศ", q: "การจำแนกประเภทของ 'ชีวนิเวศแหล่งน้ำ' (Aquatic Biome) ออกเป็น น้ำจืด น้ำเค็ม และปากแม่น้ำ ใช้เกณฑ์ทางกายภาพข้อใดเป็นหลัก", opts: ["ก. อุณหภูมิของน้ำ", "ข. ค่าความเค็มของแหล่งน้ำ (Salinity)", "ค. ความลึกของการส่องสว่างของแสง", "ง. ปริมาณแก๊สออกซิเจนที่ละลายในน้ำ"], ans: "ข", exp: "การจำแนกชีวนิเวศแหล่งน้ำใช้ค่าความเค็มของแหล่งน้ำ (Salinity) เป็นเกณฑ์ทางกายภาพหลัก" },
      { id: 61, cat: "W9_ระบบนิเวศ", q: "ชีวนิเวศน้ำเค็ม (Marine Biome) มีค่าความเค็มมาตรฐานเฉลี่ยอยู่ที่ประมาณเท่าใด", opts: ["ก. 0-1 ppt", "ข. 5-15 ppt", "ค. 30 - 35 ppt", "ง. 50-60 ppt"], ans: "ค", exp: "ค่าความเค็มมาตรฐานของน้ำทะเลในชีวนิเวศน้ำเค็มอยู่ที่ประมาณ 30 ถึง 35 ppt (parts per thousand)" },
      { id: 62, cat: "W9_ระบบนิเวศ", q: "ข้อใดอธิบายธรรมชาติของ 'ระบบนิเวศ' ในฐานะที่เป็น 'ระบบเปิด' (Open System) ได้ถูกต้องที่สุด", opts: ["ก. มีการหมุนเวียนพลังงานเป็นวัฏจักรสมบูรณ์โดยไม่ต้องรับพลังงานจากภายนอก", "ข. ต้องมีการนำเข้าพลังงาน (แสงอาทิตย์) อยู่ตลอดเวลา และสูญเสียพลังงานออกไปในรูปความร้อน", "ค. สารอาหารภายในระบบนิเวศจะถูกใช้แล้วหมดไปโดยไม่มีการถ่ายเทระหว่างระบบนิเวศ", "ง. สิ่งมีชีวิตทุกชนิดสามารถดำรงชีวิตอยู่ได้โดยไม่พึ่งพาสิ่งแวดล้อมทางกายภาพ"], ans: "ข", exp: "ระบบนิเวศเป็นระบบเปิดที่ต้องรับพลังงานจากดวงอาทิตย์เข้ามาอย่างต่อเนื่อง และมีการสูญเสียพลังงานออกไปในรูปความร้อน" },
      { id: 63, cat: "W9_ระบบนิเวศ", q: "ปรากฏการณ์ 'ยูโทรฟิเคชัน' (Eutrophication) ในแหล่งน้ำ เกิดจากสาเหตุใดและส่งผลกระทบอย่างไร", opts: ["ก. สารพิษโลหะหนักตกค้าง ทำให้ปลาตายทันที", "ข. การเพิ่มขึ้นของธาตุอาหาร (เช่น ฟอสฟอรัส/ไนโตรเจน) ทำให้สาหร่ายบลูม น้ำขุ่น และสิ่งมีชีวิตขาดออกซิเจน", "ค. การลดลงของแก๊สคาร์บอนไดออกไซด์ ทำให้ผู้ผลิตปฐมภูมิหยุดการเจริญเติบโต", "ง. อุณหภูมิของน้ำลดลงอย่างรวดเร็ว ทำให้พืชน้ำไม่สามารถสังเคราะห์แสงได้"], ans: "ข", exp: "การสะสมของธาตุอาหารฟอสฟอรัสและไนโตรเจนมากเกินไป ทำให้สาหร่ายเจริญเติบโตอย่างรวดเร็ว (Algal bloom) จนน้ำเน่าเสียและขาดออกซิเจน" },
      { id: 64, cat: "W9_ระบบนิเวศ", q: "สิ่งมีชีวิตกลุ่มใดจัดเป็น 'ผู้ผลิตปฐมภูมิ' (Primary Producer) ในระบบนิเวศทางน้ำ", opts: ["ก. แพลงก์ตอนสัตว์ (Zooplankton) และ ปลาเล็ก", "ข. สาหร่าย (Algae) และ สาหร่ายสีเขียวแกมน้ำเงิน (Cyanobacteria)", "ค. กุ้ง และ หอยชนิดต่างๆ", "ง. แบคทีเรียย่อยสลายซาก (Decomposers)"], ans: "ข", exp: "สาหร่ายและไซยาโนแบคทีเรียทำหน้าที่สังเคราะห์ด้วยแสง เป็นผู้ผลิตปฐมภูมิในระบบนิเวศทางน้ำ" },
      { id: 65, cat: "W9_ระบบนิเวศ", q: "อัตราที่ผู้ผลิตสร้างขึ้นและเก็บรักษาพลังงานไว้ในรูปของเนื้อเยื่อ เรียกว่าอะไร", opts: ["ก. ผลผลิตปฐมภูมิ (Primary Production)", "ข. การหายใจระดับเซลล์ (Respiration)", "ค. ภาวะธำรงดุลของระบบนิเวศ (Ecological Homeostasis)", "ง. ประสิทธิภาพทางนิเวศวิทยา (Ecological Efficiency)"], ans: "ก", exp: "Primary Production (ผลผลิตปฐมภูมิ) คืออัตราที่ผู้ผลิตเปลี่ยนพลังงานแสงเป็นเนื้อเยื่อชีวมวล" },
      { id: 66, cat: "W9_ระบบนิเวศ", q: "ข้อใดคือความแตกต่างที่สำคัญระหว่าง 'การไหลของพลังงาน' (Energy Flow) และ 'การหมุนเวียนสารอาหาร' (Nutrient Cycling) ในระบบนิเวศ", opts: ["ก. พลังงานหมุนเวียนเป็นวัฏจักร ส่วนสารอาหารไหลไปในทิศทางเดียว", "ข. พลังงานไหลไปทิศทางเดียวและสูญเสียเป็นความร้อน ส่วนสารอาหารหมุนเวียนเป็นวัฏจักร", "ค. ทั้งพลังงานและสารอาหารต่างหมุนเวียนเป็นวัฏจักรเหมือนกัน", "ง. ทั้งพลังงานและสารอาหารต่างไหลไปทิศทางเดียวและสูญหายไปจากโลก"], ans: "ข", exp: "พลังงานไหลไปในทิศทางเดียวและสูญเสียเป็นความร้อน ส่วนสารอาหารจะหมุนเวียนเป็นวัฏจักร" },
      { id: 67, cat: "W9_ระบบนิเวศ", q: "ในห่วงโซ่อาหาร (Food Chain) พลังงานที่ถ่ายทอดจากเนื้อเยื่อของสิ่งมีชีวิตในลำดับขั้นการกินหนึ่งไปยังลำดับขั้นถัดไป มีอยู่ประมาณร้อยละเท่าใด", opts: ["ก. ร้อยละ 1-2", "ข. ร้อยละ 5 - 30 (โดยเฉลี่ยคิดเป็นร้อยละ 10)", "ค. ร้อยละ 50 - 60", "ง. ร้อยละ 80-90"], ans: "ข", exp: "ตามกฎ 10 เปอร์เซ็นต์ พลังงานที่ถ่ายทอดไปยังลำดับขั้นถัดไปมีเฉลี่ยประมาณร้อยละ 10 (อยู่ในช่วง 5-30%)" },
      { id: 68, cat: "W9_ระบบนิเวศ", q: "ห่วงโซ่อาหารแบบใดที่มีจุดเริ่มต้นจาก 'ซากพืชซากสัตว์ที่เน่าเปื่อย' ส่งต่อไปยังผู้บริโภคซาก", opts: ["ก. Predator / Grazing food chain", "ข. Parasitic food chain", "ค. Detritus / Saprophytic food chain", "ง. Mixed food chain"], ans: "ค", exp: "Detritus / Saprophytic food chain เป็นห่วงโซ่อาหารที่เริ่มต้นจากซากอินทรีย์ที่เน่าเปื่อย" },
      { id: 69, cat: "W9_ระบบนิเวศ", q: "ชุดของสิ่งมีชีวิตข้อใด แสดงห่วงโซ่อาหารแบบปรสิต (Parasitic food chain) ได้ถูกต้อง", opts: ["ก. หญ้า → วัว → เสือ", "ข. สุนัข → หมัด → โพรโทซัว → แบคทีเรีย → ไวรัส", "ค. ซากสัตว์ → หนอนแมลงวัน → ปลา → คน", "ง. ข้าวเปลือก → ไก่ → งู"], ans: "ข", exp: "ห่วงโซ่อาหารแบบปรสิตเริ่มต้นจากโฮสต์ขนาดใหญ่ไปสู่ปรสิตที่มีขนาดเล็กลงเรื่อยๆ (สุนัข → หมัด → โพรโทซัว → แบคทีเรีย → ไวรัส)" },
      { id: 70, cat: "W9_ระบบนิเวศ", q: "ข้อใดอธิบายความสัมพันธ์ของ 'สายใยอาหาร' (Food Web) ได้ถูกต้อง", opts: ["ก. คือการกินกันเป็นเส้นตรงเพียงทางเดียวของสิ่งมีชีวิต 3 ชนิด", "ข. ประกอบด้วยการเชื่อมโยงกันของห่วงโซ่อาหารอย่างน้อย 2 ห่วงโซ่ขึ้นไปที่มีปฏิสัมพันธ์กัน", "ค. หากสิ่งมีชีวิตชนิดใดชนิดหนึ่งสูญพันธุ์ จะไม่ส่งผลกระทบใดๆ ต่อสิ่งมีชีวิตอื่นในสายใย", "ง. มนุษย์ไม่จัดเป็นส่วนหนึ่งของสายใยอาหารในธรรมชาติ"], ans: "ข", exp: "Food Web คือเครือข่ายความสัมพันธ์ที่ซับซ้อน เกิดจากการเชื่อมโยงกันของห่วงโซ่อาหารตั้งแต่ 2 สายขึ้นไป" },
      { id: 71, cat: "W9_ระบบนิเวศ", q: "มนุษย์ที่บริโภคทั้งพืชและสัตว์ (Omnivore) จัดเป็นผู้บริโภคลำดับที่เท่าใด เมื่อมนุษย์รับประทาน 'เนื้อวัว' ที่กินหญ้าเป็นอาหาร", opts: ["ก. ผู้ผลิตปฐมภูมิ (Primary Producer)", "ข. ผู้บริโภคลำดับที่ 1 (Primary Consumer)", "ค. ผู้บริโภคลำดับที่ 2 (Secondary Consumer)", "ง. ผู้ย่อยสลาย (Decomposer)"], ans: "ค", exp: "หญ้า (ผู้ผลิต) → วัว (ผู้บริโภคลำดับที่ 1) → มนุษย์ (ผู้บริโภคลำดับที่ 2)" },
      { id: 72, cat: "W9_ระบบนิเวศ", q: "ปรากฏการณ์ 'การขยายชีวภาพ' หรือ 'Biomagnification' หมายถึงอะไร", opts: ["ก. การเพิ่มขึ้นของพลังงานในผู้บริโภคลำดับสูงสุด", "ข. การสะสมและเพิ่มความเข้มข้นของสารพิษ (เช่น DDT) ตามลำดับขั้นการกินในห่วงโซ่อาหาร", "ค. การขยายขนาดร่างกายของสิ่งมีชีวิตเมื่อได้รับสารอาหารสมบูรณ์", "ง. การเพิ่มจำนวนประชากรของผู้ผลิตปฐมภูมิในระบบนิเวศ"], ans: "ข", exp: "Biomagnification คือการที่สารพิษที่ย่อยสลายยากสะสมและเพิ่มความเข้มข้นขึ้นเรื่อยๆ ตามลำดับขั้นการกินในห่วงโซ่อาหาร" },
      { id: 73, cat: "W9_ระบบนิเวศ", q: "จากกรณีศึกษาการสะสมสารพิษ DDT ในห่วงโซ่อาหารทางน้ำ สิ่งมีชีวิตกลุ่มใดจะพบความเข้มข้นของสารพิษ DDT สะสมในเนื้อเยื่อสูงที่สุด", opts: ["ก. แพลงก์ตอนสัตว์ (Zooplankton)", "ข. ปลาขนาดเล็ก (Minnows)", "ค. ปลาขนาดใหญ่ (Needle fish)", "ง. นกกินปลาลำดับสูงสุด (Osprey)"], ans: "ง", exp: "ผู้บริโภคลำดับสูงสุดของห่วงโซ่อาหาร เช่น นกกินปลา (Osprey) จะพบการสะสมสารพิษเข้มข้นที่สุด" },
      { id: 74, cat: "W9_ระบบนิเวศ", q: "วัฏจักรทางชีวเคมีธรณี (Biogeochemical Cycle) แบ่งออกเป็น 2 ประเภทหลัก คือ วัฏจักรแบบแก๊ส และ วัฏจักรแบบตะกอน วัฏจักรในข้อใดจัดเป็น 'วัฏจักรแบบตะกอน' (Sedimentary Cycle)", opts: ["ก. วัฏจักรน้ำ", "ข. วัฏจักรคาร์บอน", "ค. วัฏจักรฟอสฟอรัส", "ง. วัฏจักรไนโตรเจน"], ans: "ค", exp: "วัฏจักรฟอสฟอรัสจัดเป็นวัฏจักรแบบตะกอน เนื่องจากไม่มีองค์ประกอบสำคัญในรูปแก๊สในบรรยากาศ" },
      { id: 75, cat: "W9_ระบบนิเวศ", q: "แหล่งสะสมขนาดใหญ่ที่สุดของธาตุคาร์บอนบนโลกที่ช่วยกักเก็บคาร์บอนไว้ในระยะยาวคือข้อใด", opts: ["ก. บรรยากาศในรูปแก๊ส CO2", "ข. เนื้อเยื่อของสัตว์กินพืช", "ค. ซากฟอสซิล (ถ่านหิน/น้ำมัน) และ ตะกอนหินปูนในมหาสมุทร", "ง. ร่างกายของมนุษย์"], ans: "ค", exp: "แหล่งสะสมคาร์บอนขนาดใหญ่ที่สุดในระยะยาวคือหินตะกอนหินปูนในมหาสมุทรและเชื้อเพลิงฟอสซิลใต้ดิน" },
      { id: 76, cat: "W9_ระบบนิเวศ", q: "ปรากฏการณ์เรือนกระจก (Greenhouse Effect) ตามธรรมชาติมีความสำคัญต่อโลกอย่างไร", opts: ["ก. ทำให้อุณหภูมิของโลกลดลงจนกลายเป็นน้ำแข็ง", "ข. ช่วยดูดกลืนและสะท้อนรังสีความร้อนไว้ ทำให้โลกมีความอบอุ่นและสิ่งมีชีวิตดำรงชีวิตอยู่ได้", "ค. ช่วยกำจัดแก๊สคาร์บอนไดออกไซด์ออกจากบรรยากาศ", "ง. ป้องกันไม่ให้รังสีอัลตราไวโอเลตส่องลงมายังพื้นโลก"], ans: "ข", exp: "ปรากฏการณ์เรือนกระจกตามธรรมชาติช่วยรักษาอุณหภูมิเฉลี่ยของโลกให้อบอุ่นพอเหมาะต่อการดำรงชีวิต" },
      { id: 77, cat: "W9_ระบบนิเวศ", q: "สิ่งมีชีวิตกลุ่มเดียวในธรรมชาติที่มีบทบาทสำคัญในการเปลี่ยนแก๊สไนโตรเจน (N2) ในบรรยากาศให้อยู่ในรูปที่พืชนำไปใช้ได้ (Nitrogen Fixation) คือข้อใด", opts: ["ก. พืชตระกูลถั่ว", "ข. แบคทีเรียตรึงไนโตรเจน (Nitrogen-fixing bacteria)", "ค. เห็ดและรา", "ง. สัตว์เคี้ยวเอื้อง"], ans: "ข", exp: "แบคทีเรียตรึงไนโตรเจน (Nitrogen-fixing bacteria) เป็นสิ่งมีชีวิตกลุ่มเดียวที่เปลี่ยนแก๊ส N2 ให้อยู่ในรูปสารประกอบที่พืชใช้ได้" },
      { id: 78, cat: "W9_ระบบนิเวศ", q: "แหล่งสะสมขนาดใหญ่ที่สุดของ 'ธาตุกำมะถัน' (Sulfur) ในเปลือกโลก มักพบอยู่ในรูปของแร่ชนิดใด", opts: ["ก. แร่คาร์บอเนต และ แร่คอรัล", "ข. แร่ไพไรต์ (Pyrite) และ แร่ยิปซัม (Gypsum)", "ค. แร่ควอตซ์ และ แร่เฟลด์สปาร์", "ง. แร่ฮีมาไทต์ และ แร่แมกนีไทต์"], ans: "ข", exp: "กำมะถันในเปลือกโลกส่วนใหญ่สะสมอยู่ในรูปแร่ไพไรต์ (Pyrite) และแร่ยิปซัม (Gypsum)" },
      { id: 79, cat: "W9_ระบบนิเวศ", q: "ไม้ยืนต้นขนาดใหญ่ความหนาแน่น 1 ตัน มีความสามารถในการช่วยลดภาวะโลกร้อนและปรับปรุงสิ่งแวดล้อมตามข้อใด (ตามสไลด์บทเรียน)", opts: ["ก. กักเก็บคาร์บอนได้เฉลี่ย 1 - 1.7 ตันคาร์บอน และปลดปล่อยออกซิเจนรองรับมนุษย์ได้ 2 คน/ปี", "ข. ดูดซับฝุ่นควันได้ 100 กิโลกรัม/ปี", "ค. ปลดปล่อยแก๊สคาร์บอนมอนอกไซด์เพื่อปรับสมดุลอากาศ", "ง. เพิ่มอุณหภูมิรอบบ้านขึ้น 2-4 องศาเซลเซียส"], ans: "ก", exp: "ไม้ยืนต้นขนาด 1 ตัน กักเก็บคาร์บอนได้เฉลี่ย 1 - 1.7 ตันคาร์บอน และปล่อยออกซิเจนรองรับมนุษย์ได้ประมาณ 2 คน/ปี" },
      { id: 80, cat: "W9_ระบบนิเวศ", q: "ข้อสรุปที่สำคัญที่สุดของเนื้อหาเรื่อง 'ระบบนิเวศและการกระทำของมนุษย์' คือข้อใด", opts: ["ก. มนุษย์สามารถสร้างระบบนิเวศใหม่ทดแทนธรรมชาติได้ทั้งหมดโดยใช้เทคโนโลยี", "ข. ระบบนิเวศมีฟื้นตัวได้เองเสมอไม่ว่าจะถูกรบกวนรุนแรงเพียงใด", "ค. โลกเป็นระบบที่เชื่อมโยงกัน การเปลี่ยนแปลงปัจจัยหนึ่งจากกิจกรรมมนุษย์ส่งผลกระทบต่อทุกวัฏจักรในระบบโลก", "ง. ทรัพยากรธรรมชาติทุกชนิดไม่มีวันหมดไปจากโลก"], ans: "ค", exp: "โลกเป็นระบบบูรณาการที่เชื่อมโยงกัน กิจกรรมของมนุษย์ที่กระทบต่อปัจจัยหนึ่งย่อมส่งผลสะเทือนต่อทุกวัฏจักรในระบบโลก" },

      // หมวดที่ 3: W10_ฟื้นฟูธรรมชาติ (81-120)
      { id: 81, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ตามสไลด์บทเรียน Key Concepts หลัก 2 ประการ ของการเรียนในบทนี้คือข้อใด", opts: ["ก. อิทธิพลของมนุษย์ต่อระบบนิเวศ และ หลักการอนุรักษ์ทรัพยากรธรรมชาติ", "ข. การประเมินมูลค่าทางเศรษฐกิจ และ การบังคับใช้กฎหมายสิ่งแวดล้อม", "ค. การทำฟาร์มสัตว์ป่า และ การส่งออกทรัพยากรแร่ธาตุ", "ง. การสร้างเขื่อนกักเก็บน้ำ และ การทำอุตสาหกรรมแปรรูป"], ans: "ก", exp: "Key Concepts หลัก 2 ข้อคือ 1. อิทธิพลของมนุษย์ต่อระบบนิเวศ และ 2. หลักการอนุรักษ์ทรัพยากรธรรมชาติ" },
      { id: 82, cat: "W10_ฟื้นฟูธรรมชาติ", q: "จากข้อมูลสถิติในสไลด์ ในทุกๆ 20 นาที โลกเรามีประชากรมนุษย์เพิ่มขึ้น และสูญเสียสิ่งมีชีวิตไปในอัตราส่วนเท่าใด", opts: ["ก. เพิ่มขึ้น 1,000 คน / สูญเสีย 5 ชนิด", "ข. เพิ่มขึ้น 3,500 คน / สูญเสีย 1 ชนิดหรือมากกว่า", "ค. เพิ่มขึ้น 5,000 คน / สูญเสีย 10 ชนิด", "ง. เพิ่มขึ้น 10,000 คน / สูญเสีย 2 ชนิด"], ans: "ข", exp: "ทุกๆ 20 นาที โลกมีมนุษย์เพิ่มขึ้นประมาณ 3,500 คน และสูญเสียสิ่งมีชีวิตไป 1 ชนิดหรือมากกว่า" },
      { id: 83, cat: "W10_ฟื้นฟูธรรมชาติ", q: "สาเหตุหลักที่ส่งผลให้เกิดการลดลงของความหลากหลายทางชีวภาพบนโลกสูงถึงร้อยละ 80 คือข้อใด", opts: ["ก. การล่าสัตว์เพื่อการกีฬา", "ข. การทำลายถิ่นที่อยู่อาศัย (Habitat Destruction)", "ค. การแพร่พันธุ์ของชนิดพันธุ์ต่างถิ่น (Invasive Species)", "ง. มลพิษทางเสียงจากอุตสาหกรรม"], ans: "ข", exp: "ร้อยละ 80 ของการลดลงของความหลากหลายทางชีวภาพเกิดจากการทำลายถิ่นที่อยู่อาศัย (Habitat Destruction)" },
      { id: 84, cat: "W10_ฟื้นฟูธรรมชาติ", q: "หากอุณหภูมิโลกเฉลี่ยเพิ่มขึ้นเกินกว่ากี่องศาเซลเซียส จะส่งผลให้สิ่งมีชีวิตที่รู้จักบนโลกเสี่ยงต่อการสูญพันธุ์มากถึงร้อยละ 70", opts: ["ก. 1.5 องศาเซลเซียส", "ข. 2.0 องศาเซลเซียส", "ค. 3.5 องศาเซลเซียส", "ง. 5.0 องศาเซลเซียส"], ans: "ค", exp: "หากอุณหภูมิเฉลี่ยของโลกเพิ่มขึ้นเกิน 3.5 องศาเซลเซียส สิ่งมีชีวิตถึงร้อยละ 70 จะเสี่ยงต่อการสูญพันธุ์" },
      { id: 85, cat: "W10_ฟื้นฟูธรรมชาติ", q: "สัตว์ป่าของไทยในข้อใดที่สไลด์บทเรียนยกตัวอย่างขึ้นมาในกลุ่มสิ่งมีชีวิตที่สูญพันธุ์ไปแล้วหรืออยู่ในภาวะวิกฤต", opts: ["ก. สมัน (เนื้อสมัน) แรด กูปรี กวางผา ละอง/ละมั่ง ควายป่า นกเจ้าฟ้าหญิงสิรินธร", "ข. ช้างไทย เสือโคร่ง หมีควาย เก้งหม้อ", "ค. กระทิง วัวแดง กระเล็น ค้างคาวคุณกิตติ", "ง. พะยูน นกแต้วแร้วท้องดำ สมเสร็จ เลียงผา"], ans: "ก", exp: "สไลด์ระบุกลุ่มสัตว์ป่าหายาก/สูญพันธุ์ของไทย เช่น สมัน แรด กูปรี กวางผา ละอง/ละมั่ง ควายป่า และนกเจ้าฟ้าหญิงสิรินธร" },
      { id: 86, cat: "W10_ฟื้นฟูธรรมชาติ", q: "จากข้อมูลรายงาน Living Planet Report ในสไลด์ โลกเราสูญเสียสัตว์ป่า (Wildlife) ไปแล้วประมาณเท่าใดในช่วง 40 ปีที่ผ่านมา", opts: ["ก. ร้อยละ 20", "ข. ร้อยละ 35", "ค. ร้อยละ 50", "ง. ร้อยละ 75"], ans: "ค", exp: "โลกได้สูญเสียสัตว์ป่าไปแล้วประมาณร้อยละ 50 ในช่วงเวลา 40 ปีที่ผ่านมา" },
      { id: 87, cat: "W10_ฟื้นฟูธรรมชาติ", q: "จากข้อมูลขององค์กร IFAW ในสไลด์ ช้างแอฟริกาถูกล่าเพื่อเอางาเฉลี่ยในอัตราความถี่เท่าใด", opts: ["ก. ทุกๆ 15 นาที ถูกล่า 1 ตัว", "ข. ทุกๆ 1 ชั่วโมง ถูกล่า 1 ตัว", "ค. ทุกๆ 1 วัน ถูกล่า 10 ตัว", "ง. ทุกๆ 1 สัปดาห์ ถูกล่า 100 ตัว"], ans: "ก", exp: "ข้อมูลระบุว่า 'Every 15 minutes an elephant is killed for its tusks' หรือถูกล่าเฉลี่ย 1 ตัวในทุกๆ 15 นาที" },
      { id: 88, cat: "W10_ฟื้นฟูธรรมชาติ", q: "กรอบความคิดแบบ 'ECO' มีมุมมองที่แตกต่างจาก 'EGO' ในเรื่องความสัมพันธ์ระหว่างมนุษย์กับธรรมชาติอย่างไร", opts: ["ก. ECO มองว่ามนุษย์เป็นผู้นำและอยู่จุดสูงสุดของสิ่งมีชีวิตทั้งหมด", "ข. ECO มองว่ามนุษย์เป็นเพียงส่วนหนึ่งของระบบนิเวศ มีความเท่าเทียมและเชื่อมโยงกับสิ่งมีชีวิตอื่น", "ค. ECO มุ่งเน้นการใช้ทรัพยากรธรรมชาติเพื่อตอบสนองความต้องการของมนุษย์ก่อน", "ง. ECO เชื่อว่าเทคโนโลยีสามารถใช้นำหน้าและทดแทนธรรมชาติได้ทั้งหมด"], ans: "ข", exp: "ECO มองว่ามนุษย์เป็นเพียงส่วนหนึ่งของระบบนิเวศ มีความเท่าเทียมและเชื่อมโยงกับสิ่งมีชีวิตอื่น" },
      { id: 89, cat: "W10_ฟื้นฟูธรรมชาติ", q: "แก๊สเรือนกระจกที่เพิ่มขึ้นจากกิจกรรมของมนุษย์ ตามสไลด์บทเรียน ไม่ได้ รวมแก๊สชนิดใด", opts: ["ก. คาร์บอนไดออกไซด์ (CO2) และ มีเทน (CH4)", "ข. ไนตรัสออกไซด์ (N2O) และ คลอโรฟลูออโรคาร์บอน (CFC)", "ค. ไฮโดรฟลูออโรคาร์บอน (HFC) และ ซัลเฟอร์เฮกซะฟลูออไรด์ (SF6)", "ง. แก๊สอาร์กอน (Ar) และ แก๊สพลาสมา (Plasma)"], ans: "ง", exp: "แก๊สอาร์กอน (Ar) เป็นแก๊สเฉื่อยที่มีอยู่เดิมตามธรรมชาติในบรรยากาศ ไม่ใช่ก๊าซเรือนกระจกที่เกิดจากกิจกรรมมนุษย์" },
      { id: 90, cat: "W10_ฟื้นฟูธรรมชาติ", q: "นิยามของ 'ภาวะโลกร้อน' (Global Warming) ตามสไลด์บทเรียนหมายถึงข้อใด", opts: ["ก. การเพิ่มขึ้นของอุณหภูมิเฉพาะบริเวณทะเลทรายเท่านั้น", "ข. อุณหภูมิเฉลี่ยของอากาศบนโลกที่สูงขึ้น ทั้งบริเวณผิวโลกและน้ำในมหาสมุทร", "ค. การเกิดคลื่นความร้อนเฉียบพลันในฤดูร้อน", "ง. การอบอ้าวของบรรยากาศเนื่องจากแก๊สออกซิเจนหนาแน่น"], ans: "ข", exp: "ภาวะโลกร้อนหมายถึง อุณหภูมิเฉลี่ยของอากาศบนโลกที่สูงขึ้น ทั้งบริเวณผิวโลกและน้ำในมหาสมุทร" },
      { id: 91, cat: "W10_ฟื้นฟูธรรมชาติ", q: "เมื่อธารน้ำแข็งขั้วโลกละลายทำให้ระดับน้ำทะเลสูงขึ้น พื้นที่ประเภทใดจะได้รับความเสียหายรุนแรงมากที่สุด", opts: ["ก. บริเวณที่ราบสูง", "ข. หมู่เกาะกลางมหาสมุทร", "ค. บริเวณเทือกเขาสูง", "ง. พื้นที่ทะเลทรายตอนในของทวีป"], ans: "ข", exp: "พื้นที่ที่จะได้รับความเสียหายรุนแรงมากที่สุดคือ หมู่เกาะกลางมหาสมุทร และพื้นที่ชายฝั่งลุ่มต่ำ" },
      { id: 92, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ผลกระทบทางอ้อมของภาวะโลกร้อนต่อสุขภาพของมนุษย์ในเรื่องการแพร่ระบาดของโรค เกิดจากสาเหตุใด", opts: ["ก. อุณหภูมิที่สูงขึ้นทำให้ยุงซึ่งเป็นพาหะของโรคร้ายต่างๆ สามารถแพร่กระจายตัวได้ไกลขึ้น", "ข. เชื้อไวรัสทนทานต่อแสงแดดได้ยาวนานขึ้น", "ค. แบคทีเรียในน้ำเปลี่ยนโครงสร้างเป็นแก๊สพิษ", "ง. มนุษย์สูญเสียภูมิคุ้มกันจากการดื่มน้ำทะเล"], ans: "ก", exp: "อุณหภูมิที่สูงขึ้นทำให้ยุงซึ่งเป็นพาหะของโรคร้ายต่างๆ สามารถแพร่กระจายตัวได้ไกลและรวดเร็วขึ้น" },
      { id: 93, cat: "W10_ฟื้นฟูธรรมชาติ", q: "จากรายงานข้อมูลของ WWF ในสไลด์ มนุษย์ได้รับชิ้นส่วนไมโครพลาสติกเข้าสู่ร่างกายในแต่ละสัปดาห์จากแหล่งใดมากที่สุด (จำนวน 1,769 ชิ้น)", opts: ["ก. อาหารทะเล", "ข. เกลือปรุงอาหาร", "ค. เครื่องดื่มเบียร์", "ง. น้ำดื่ม"], ans: "ง", exp: "มนุษย์ได้รับชิ้นส่วนไมโครพลาสติกจากน้ำดื่มมากที่สุดในแต่ละสัปดาห์ คิดเป็นจำนวนถึง 1,769 ชิ้น" },
      { id: 94, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ในแต่ละปี มีปริมาณขยะพลาสติกรั่วไหลลงสู่ทะเลทั่วโลกประมาณเท่าใด", opts: ["ก. 1.3 ล้านตัน", "ข. 5 ล้านตัน", "ค. 13 ล้านตัน", "ง. 50 ล้านตัน"], ans: "ค", exp: "ปริมาณขยะพลาสติกรั่วไหลลงสู่ทะเลทั่วโลกสูงถึงประมาณ 13 ล้านตันในแต่ละปี" },
      { id: 95, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ตัวบ่งชี้มาตรฐาน 3 ด้าน ที่ใช้ในการวัดหรือประเมินความหลากหลายทางชีวภาพในแต่ละพื้นที่ ประกอบด้วยอะไรบ้าง", opts: ["ก. ความหลากหลายทางพันธุกรรม, ความหลากหลายของชนิด, ความหลากหลายของระบบนิเวศ", "ข. ความหลากหลายทางประชากร, ความหลากหลายทางภาษา, ความหลากหลายทางวัฒนธรรม", "ค. ความหลากหลายทางเคมี, ความหลากหลายทางกายภาพ, ความหลากหลายทางชีวภาพ", "ง. ความหลากหลายของพืช, ความหลากหลายของสัตว์, ความหลากหลายของจุลินทรีย์"], ans: "ก", exp: "ประเมินจาก 3 ด้านคือ ความหลากหลายทางพันธุกรรม, ความหลากหลายของชนิด (Species) และความหลากหลายของระบบนิเวศ" },
      { id: 96, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ข้อใดคือเป้าหมายสำคัญของการศึกษาศาสตร์ 'ชีววิทยาเชิงอนุรักษ์' (Conservation Biology)", opts: ["ก. สำรวจขอบเขตความหลากหลายทางชีวภาพ และ หาแนวทางคงสภาพและใช้ประโยชน์อย่างยั่งยืน", "ข. การดัดแปลงพันธุกรรมสิ่งมีชีวิตเพื่อสร้างสายพันธุ์ใหม่ที่ทนต่อมลพิษ", "ค. การกำจัดสิ่งมีชีวิตที่เป็นพาหะนำโรคให้หมดไปจากระบบนิเวศ", "ง. การแปรรูปพื้นที่ป่าไม้ให้กลายเป็นพื้นที่เกษตรอุตสาหกรรม"], ans: "ก", exp: "เป้าหมายหลักคือ สำรวจขอบเขตความหลากหลายทางชีวภาพ และหาแนวทางในการคงสภาพและใช้ประโยชน์อย่างยั่งยืน" },
      { id: 97, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ข้อความที่ว่า 'Extinction is Forever' ในสไลด์บทเรียน ต้องการสื่อถึงความจริงในข้อใด", opts: ["ก. สิ่งมีชีวิตที่สูญพันธุ์ไปแล้ว สามารถสร้างขึ้นใหม่ได้ด้วยเทคโนโลยีโคลนนิงเสมอ", "ข. เมื่อสิ่งมีชีวิตชนิดใดสูญพันธุ์ เท่ากับเราได้สูญเสียลักษณะที่เป็นเอกลักษณ์เฉพาะชนิดนั้นไปจากโลกตลอดกาล", "ค. การสูญพันธุ์เป็นกระบวนการปกติที่เกิดขึ้นและจบลงภายในระยะเวลาอันสั้น", "ง. มนุษย์สามารถทดแทนการสูญพันธุ์ได้โดยการนำสัตว์สายพันธุ์อื่นมาแทนที่"], ans: "ข", exp: "เมื่อสิ่งมีชีวิตใดสูญพันธุ์ไป หมายถึงเราได้สูญเสียลักษณะที่เป็นเอกลักษณ์ประจำชนิดนั้นไปจากโลกแล้วตลอดกาล" },
      { id: 98, cat: "W10_ฟื้นฟูธรรมชาติ", q: "นิยามของพื้นที่ที่เรียกว่า 'Biodiversity Hotspot' คือข้อใด", opts: ["ก. พื้นที่ทะเลทรายที่มีอุณหภูมิสูงและไม่มีสิ่งมีชีวิตอาศัยอยู่", "ข. พื้นที่ที่มีความหลากหลายทางชีวภาพสูง มีสิ่งมีชีวิตเฉพาะถิ่น แต่กำลังตกอยู่ในภาวะถูกคุกคามและถูกทำลาย", "ค. พื้นที่เขตเมืองที่มีการใช้งานพลังงานความร้อนสูง", "ง. พื้นที่ขั้วโลกที่มีน้ำแข็งละลายอย่างรวดเร็ว"], ans: "ข", exp: "Hotspot คือพื้นที่ที่มีความหลากหลายทางชีวภาพสูง มีสิ่งมีชีวิตเฉพาะถิ่น แต่กำลังถูกคุกคามและถิ่นที่อยู่กำลังถูกทำลาย" },
      { id: 99, cat: "W10_ฟื้นฟูธรรมชาติ", q: "เหตุใดนักชีววิทยาเชิงอนุรักษ์จึงรณรงค์ให้อนุรักษ์พื้นที่ 'Biodiversity Hotspot' ก่อนเป็นลำดับแรก", opts: ["ก. เพราะใช้บประมาณในการดูแลน้อยที่สุด", "ข. เพราะการรักษาสภาพธรรมชาติของระบบนิเวศที่เป็นบ้านของสิ่งมีชีวิตหลายชนิด จะช่วยปกป้องสิ่งมีชีวิตทั้งหมดรวมถึงชนิดที่ใกล้สูญพันธุ์ไว้ได้พร้อมกัน", "ค. เพราะเป็นพื้นที่ที่ไม่ได้รับผลกระทบจากภาวะโลกร้อน", "ง. เพราะเป็นพื้นที่ที่มนุษย์เข้าไปใช้ประโยชน์ทางอุตสาหกรรมได้ง่ายที่สุด"], ans: "ข", exp: "เพราะการคงอยู่ของสภาพธรรมชาติซึ่งเป็นบ้านของสิ่งมีชีวิตหลายชนิด จะช่วยปกป้องความหลากหลายทางชีวภาพทั้งหมดรวมถึงชนิดที่ใกล้สูญพันธุ์ไว้ได้พร้อมกัน" },
      { id: 100, cat: "W10_ฟื้นฟูธรรมชาติ", q: "หลักการอนุรักษ์ทรัพยากรธรรมชาติที่ระบุในสไลด์บทเรียน ประกอบด้วยกี่หลักการ", opts: ["ก. 4 หลักการ", "ข. 5 หลักการ", "ค. 6 หลักการ", "ง. 7 หลักการ"], ans: "ค", exp: "มี 6 หลักการ ได้แก่ 1. การใช้แบบยั่งยืน 2. การกักเก็บ 3. การรักษาการซ่อมแซม 4. การฟื้นฟู 5. การป้องกัน 6. การพัฒนาที่ยั่งยืน" },
      { id: 101, cat: "W10_ฟื้นฟูธรรมชาติ", q: "การปฏิเสธบรรจุภัณฑ์ที่สร้างมลพิษ เช่น กล่องโฟม และพลาสติกแบบครั้งเดียวทิ้ง ตรงกับหลัก 7R ในข้อใด", opts: ["ก. Reduce", "ข. Reuse", "ค. Refuse", "ง. Recycle"], ans: "ค", exp: "Refuse หมายถึง การปฏิเสธบรรจุภัณฑ์สร้างมลพิษ เช่น โฟม และพลาสติกใช้ครั้งเดียวทิ้ง" },
      { id: 102, cat: "W10_ฟื้นฟูธรรมชาติ", q: "กิจกรรม 'การนำภาชนะมาเติมเครื่องปรุง ธัญพืช หรือน้ำยา' ตามร้าน Refill Shoppe จัดเป็นการประยุกต์ใช้หลัก 7R ในข้อใด", opts: ["ก. Refill / Reuse", "ข. Return", "ค. Repair", "ง. Recycle"], ans: "ก", exp: "Refill / Reuse คือการนำภาชนะเดิมมาเติมซ้ำเพื่อลดการใช้บรรจุภัณฑ์ใหม่" },
      { id: 103, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ข้อใดจัดเป็นตัวอย่างของการอนุรักษ์ทรัพยากรด้วยวิธี 'การกักเก็บ' (Storage)", opts: ["ก. การถนอมอาหาร การทำยุ้งฉาง และการเก็บกักน้ำในเขื่อน", "ข. การปลูกป่าชายเลนทดแทนพื้นที่นากุ้งร้าง", "ค. การออกกฎหมายลงโทษผู้ล่าสัตว์ป่า", "ง. การนำขวดแก้วไปหลอมผลิตใหม่"], ans: "ก", exp: "การกักเก็บ (Storage) คือการรวบรวมทรัพยากรไว้ใช้ในยามขาดแคลน เช่น ถนอมอาหาร ยุ้งฉางข้าว หรือกักเก็บน้ำในเขื่อน" },
      { id: 104, cat: "W10_ฟื้นฟูธรรมชาติ", q: "การเติมอากาศในบ่อบำบัดน้ำเสีย หรือการเพาะพันธุ์สัตว์ป่าเพื่อนำกลับไปปล่อยคืนสู่ธรรมชาติ จัดอยู่ในหลักการอนุรักษ์ข้อใด", opts: ["ก. การกักเก็บ (Storage)", "ข. การรักษา การซ่อมแซม (Repair)", "ค. การป้องกัน (Prevention)", "ง. การใช้แบบยั่งยืน (Sustainable Utilization)"], ans: "ข", exp: "การรักษา การซ่อมแซม (Repair) คือการบำรุงรักษาเมื่อทรัพยากรถูกทำลายหรือเสื่อมโทรม" },
      { id: 105, cat: "W10_ฟื้นฟูธรรมชาติ", q: "การสร้าง 'แนวปะการังเทียม' เพื่อเสริมสร้างที่อยู่อาศัยให้สิ่งมีชีวิตในทะเล จัดเป็นตัวอย่างของหลักการอนุรักษ์ข้อใด", opts: ["ก. การกักเก็บ (Storage)", "ข. การฟื้นฟู (Restoration)", "ค. การป้องกัน (Prevention)", "ง. การพัฒนาที่ยั่งยืน (Sustainable Development)"], ans: "ข", exp: "การสร้างแนวปะการังเทียมเพื่อฟื้นฟูระบบนิเวศทางทะเลที่ถูกทำลายจัดอยู่ในกลุ่ม การฟื้นฟู (Restoration)" },
      { id: 106, cat: "W10_ฟื้นฟูธรรมชาติ", q: "การประกาศจัดตั้ง 'เขตรักษาพันธุ์สัตว์ป่าภูเขียว-ทุ่งกะมัง หรือ สวนพฤกษศาสตร์สมเด็จพระนางเจ้าสิริกิติ์' จัดเป็นตัวอย่างของหลักการอนุรักษ์ข้อใด", opts: ["ก. การป้องกัน (Prevention)", "ข. การซ่อมแซม (Repair)", "ค. การกักเก็บ (Storage)", "ง. การฟื้นฟู (Restoration)"], ans: "ก", exp: "การป้องกัน (Prevention) คือการคุ้มครองทรัพยากรธรรมชาติโดยใช้กฎหมายและจัดตั้งพื้นที่คุ้มครองเพื่อไม่ให้ถูกทำลาย" },
      { id: 107, cat: "W10_ฟื้นฟูธรรมชาติ", q: "นิยามของการพัฒนาที่ยั่งยืน (Sustainable Development) คือการพัฒนาประเภทใด", opts: ["ก. การพัฒนาที่มุ่งเน้นผลกำไรทางเศรษฐกิจสูงสุดโดยไม่จำกัดการใช้พลังงาน", "ข. การพัฒนาที่ต้องมีความระมัดระวังถึงความเสียหายหรือผลกระทบต่อสิ่งแวดล้อม เพื่อให้ประชากรมีคุณภาพชีวิตที่ดีขึ้น", "ค. การหยุดสร้างสิ่งก่อสร้างใหม่ทุกประเภทในประเทศ", "ง. การย้ายฐานอุตสาหกรรมทั้งหมดไปไว้ในเขตทะเลทราย"], ans: "ข", exp: "การพัฒนาที่ยั่งยืนคือการพัฒนาที่คำนึงถึงผลกระทบต่อสิ่งแวดล้อม เพื่อให้ประชากรมีคุณภาพชีวิตที่ดีขึ้นโดยไม่ทำลายทรัพยากรของคนรุ่นหลัง" },
      { id: 108, cat: "W10_ฟื้นฟูธรรมชาติ", q: "เป้าหมายการพัฒนาที่ยั่งยืน (SDGs) ของสหประชาชาติ ประกอบด้วยโครงสร้างตัวเลขตามข้อใด", opts: ["ก. 10 เป้าหมาย 50 เป้าประสงค์ 100 ตัวชี้วัด", "ข. 17 เป้าหมาย 169 เป้าประสงค์ 241 ตัวชี้วัด", "ค. 20 เป้าหมาย 200 เป้าประสงค์ 300 ตัวชี้วัด", "ง. 30 เป้าหมาย 100 เป้าประสงค์ 150 ตัวชี้วัด"], ans: "ข", exp: "SDGs ประกอบด้วย 17 เป้าหมาย (Goals), 169 เป้าประสงค์ (Targets) และ 241 ตัวชี้วัด (Indicators)" },
      { id: 109, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ข้อตกลงเป้าหมายการพัฒนาที่ยั่งยืน (SDGs) ได้รับการลงนามยินยอมโดยนานาประเทศกี่ประเทศ และเกิดขึ้นเมื่อใด", opts: ["ก. 100 ประเทศ เมื่อเดือนมกราคม 2550", "ข. 193 ประเทศ เมื่อเดือนสิงหาคม 2558", "ค. 200 ประเทศ เมื่อเดือนธันวาคม 2560", "ง. 150 ประเทศ เมื่อเดือนมิถุนายน 2565"], ans: "ข", exp: "193 ประเทศทั่วโลกตกลงร่วมกันที่จะปฏิบัติตามเป้าหมาย SDGs เมื่อเดือนสิงหาคม 2558" },
      { id: 110, cat: "W10_ฟื้นฟูธรรมชาติ", q: "เป้าหมายการพัฒนาที่ยั่งยืนข้อที่ 13 (SDG 13: Climate Action) มุ่งเน้นการดำเนินงานในเรื่องใด", opts: ["ก. การขจัดความยากจน", "ข. การจัดการน้ำสะอาดและการสุขาภิบาล", "ค. การเร่งรัดดำเนินการด้านการเปลี่ยนแปลงสภาพภูมิอากาศและผลกระทบ", "ง. การอนุรักษ์ทรัพยากรทางทะเล"], ans: "ค", exp: "SDG 13 มุ่งเน้นการเร่งรัดดำเนินการด้านการเปลี่ยนแปลงสภาพภูมิอากาศและผลกระทบ (Climate Action)" },
      { id: 111, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ตามแนวคิดของ 'เชฟโบ ดวงพร' ในสไลด์บทเรียน การบริโภคที่ยั่งยืนหมายถึงอะไร", opts: ["ก. การรับประทานอาหารมังสวิรัติเพียงอย่างเดียวตลอดชีวิต", "ข. การกินตามความจำเป็นต่อชีวิต เลือกรักษาสมดุลระหว่างความสุขกับการใช้ทรัพยากรอย่างรู้คุณค่าและเอื้ออาทรต่อระบบนิเวศ", "ค. การซื้ออาหารกักตุนไว้ในปริมาณมากเพื่อลดการเดินทาง", "ง. การงดเว้นการปรุงอาหารด้วยความร้อนทุกชนิด"], ans: "ข", exp: "การบริโภคที่ยั่งยืนคือการกินตามความจำเป็น รักษาสมดุลระหว่างความสุขกับการใช้ทรัพยากรที่มีจำกัดอย่างรู้คุณค่า" },
      { id: 112, cat: "W10_ฟื้นฟูธรรมชาติ", q: "นิยามของ 'Carbon Credit' ตามสไลด์บทเรียนคือข้อใด", opts: ["ก. เงินกู้ยืมจากธนาคารเพื่อนำไปใช้ซื้ออุปกรณ์ไฟฟ้าประหยัดเบอร์ 5", "ข. ปริมาณแก๊สเรือนกระจกที่สามารถลดได้ จากการทำกิจกรรมลดคาร์บอน เพื่อนำไปแลกเปลี่ยน/สนับสนุนการสร้างพื้นที่สีเขียว", "ค. ภาษีพิเศษที่จัดเก็บจากผู้ขับขี่รถยนต์ส่วนบุคคล", "ง. ใบอนุญาตในการปล่อยแก๊สพิษลงสู่แม่น้ำได้โดยไม่ผิดกฎหมาย"], ans: "ข", exp: "Carbon Credit คือปริมาณก๊าซเรือนกระจกที่สามารถลดได้จากการทำกิจกรรมลดคาร์บอน เพื่อนำไปแลกเปลี่ยนหรือสนับสนุนโครงการสิ่งแวดล้อม" },
      { id: 113, cat: "W10_ฟื้นฟูธรรมชาติ", q: "โครงการกว้านซื้อพื้นที่ป่าเพื่อจัดทำเป็นเขตอนุรักษ์ส่วนบุคคล Monteverde Cloud Forest ในประเทศคอสตาริกา เริ่มต้นโดยใคร ในช่วงทศวรรษ 1970", opts: ["ก. จอร์จ พาวเวล (George Powell)", "ข. ไรอัน ฮิคแมน (Ryan Hickman)", "ค. เกรตา ธันเบิร์ก (Greta Thunberg)", "ง. จอนนี โอลานล็อกกุน (Joni Olanlokun)"], ans: "ก", exp: "จอร์จ พาวเวล (George Powell) เป็นผู้ริเริ่มซื้อพื้นที่ป่าเพื่อจัดทำเป็นเขตอนุรักษ์ในคอสตาริกา" },
      { id: 114, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ผืนป่าสงวน Monteverde ในคอสตาริกา เป็นแหล่งที่อยู่อาศัยสำคัญของสัตว์นักล่าตระกูลแมวชนิดใด", opts: ["ก. สิงโตโตเต็มวัย และ เสือชีตาห์", "ข. เสือจาร์กัว (Jaguar) และ แมวโอซีลอต (Ocelot)", "ค. เสือดาวหิมะ และ เสือปลา", "ง. เสือโคร่งเบงกอล และ แมวดาว"], ans: "ข", exp: "ผืนป่าแห่งนี้เป็นแหล่งที่อยู่อาศัยสำคัญของเสือจากัวร์ (Jaguar) และแมวโอซีลอต (Ocelot)" },
      { id: 115, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ไม้ยืนต้นขนาดใหญ่ที่มีน้ำหนัก 1 ตัน มีความสามารถในการกักเก็บคาร์บอนตลอดอายุขัยได้เฉลี่ยเท่าใด", opts: ["ก. 0.1 - 0.5 ตันคาร์บอน", "ข. 1 - 1.7 ตันคาร์บอน", "ค. 5 - 10 ตันคาร์บอน", "ง. 20 ตันคาร์บอน"], ans: "ข", exp: "ไม้ยืนต้นขนาด 1 ตัน สามารถกักเก็บคาร์บอนได้เฉลี่ย 1 - 1.7 ตันคาร์บอน" },
      { id: 116, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ต้นไม้ 1 ต้น สามารถปลดปล่อยแก๊สออกซิเจนออกมาได้ประมาณ 200,000-250,000 ลิตรต่อปี ซึ่งสามารถรองรับความต้องการแก๊สออกซิเจนของมนุษย์ได้กี่คนต่อปี", opts: ["ก. 1 คนต่อปี", "ข. 2 คนต่อปี", "ค. 5 คนต่อปี", "ง. 10 คนต่อปี"], ans: "ข", exp: "ต้นไม้ 1 ต้นผลิตออกซิเจนได้เพียงพอต่อความต้องการของมนุษย์ 2 คนต่อปี (โดยมนุษย์ต้องการ O2 ประมาณ 130,000 ลิตร/คน/ปี)" },
      { id: 117, cat: "W10_ฟื้นฟูธรรมชาติ", q: "การคายน้ำที่ใบของต้นไม้ สามารถช่วยลดอุณหภูมิของบรรยากาศรอบๆ และอุณหภูมิรอบบ้านได้ประมาณกี่องศาเซลเซียส", opts: ["ก. ลดอุณหภูมิบรรยากาศลง 3-5 °C และรอบบ้านลง 2-4 °C", "ข. ลดอุณหภูมิบรรยากาศลง 10 °C และรอบบ้านลง 8 °C", "ค. ลดอุณหภูมิบรรยากาศลง 1 °C เท่ากันทั้งหมด", "ง. ไม่ช่วยลดอุณหภูมิ แต่ช่วยเพิ่มความชื้นเท่านั้น"], ans: "ก", exp: "การคายน้ำช่วยดึงความร้อน ทำให้อุณหภูมิบรรยากาศลดลงได้ถึง 3-5 °C และรอบตัวบ้านลดลงได้ 2-4 °C" },
      { id: 118, cat: "W10_ฟื้นฟูธรรมชาติ", q: "แนวคิดการฟื้นฟูแนวปะการังแบบ 'Complex Adaptive Reef System' ทำให้เกิดประโยชน์ที่เป็นเขื่อนมีชีวิต และส่งผลต่อชายหาดอย่างไร", opts: ["ก. ทำให้น้ำหลังแนวปะการังใส และเกิดทรายทะเลที่ขาว ละเอียด นุ่มเท้า", "ข. ทำให้หาดทรายกลายเป็นดินโคลนสีดำ", "ค. ทำให้คลื่นทะเลมีความรุนแรงเพิ่มขึ้น 2 เท่า", "ง. ทำให้เกิดการกัดเซาะชายฝั่งรุนแรงกว่าเดิม"], ans: "ก", exp: "ทำให้คลื่นสงบ น้ำหลังแนวปะการังใสสะอาด และเกิดกระบวนการสะสมตัวของทรายขาวละเอียดนุ่มเท้า" },
      { id: 119, cat: "W10_ฟื้นฟูธรรมชาติ", q: "ในปี 2565 อันดับสถานการณ์ภาพรวมคุณภาพสิ่งแวดล้อมของประเทศไทยในระดับนานาชาติ อยู่ในระดับใดเมื่อเทียบกับปี 2563", opts: ["ก. ดีขึ้น 10 อันดับ (ขยับขึ้นไปอยู่อันดับที่ 50)", "ข. แย่ลง ร่วงลงถึง 30 อันดับ (ตกไปอยู่อันดับที่ 108)", "ค. คงที่ อยู่อันดับเดิมไม่เปลี่ยนแปลง", "ง. ติดอันดับ 1 ใน 10 ของประเทศที่มีสิ่งแวดล้อมดีที่สุด"], ans: "ข", exp: "คุณภาพสิ่งแวดล้อมไทยร่วงลงถึง 30 อันดับ โดยตกลงจากอันดับ 78 (ปี 2563) ไปอยู่อันดับที่ 108 (ปี 2565)" },
      { id: 120, cat: "W10_ฟื้นฟูธรรมชาติ", q: "กิจกรรม 'SUT Plogging' ของมหาวิทยาลัยเทคโนโลยีสุรนารี เป็นการบูรณาการกิจกรรมตามข้อใดเข้าด้วยกัน", opts: ["ก. การวิ่งออกกำลังกาย (Jogging) + การเก็บขยะ (Picking Up)", "ข. การปั่นจักรยาน (Cycling) + การปลูกต้นไม้ (Planting)", "ค. การว่ายน้ำ (Swimming) + การคัดแยกพลาสติก (Sorting)", "ง. การเดินป่า (Trekking) + การทำฝายชะลอน้ำ (Dam building)"], ans: "ก", exp: "Plogging เกิดจากการนำ Jogging (วิ่งออกกำลังกาย) มารวมกับ Picking up (เก็บขยะตามทาง)" },

      // หมวดที่ 4: ความยุติธรรมกับสิ่งแวดล้อม (121-160)
      { id: 121, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ตามพระราชบัญญัติส่งเสริมและรักษาคุณภาพสิ่งแวดล้อมแห่งชาติ พ.ศ. 2535 คำว่า 'สิ่งแวดล้อม' หมายถึงข้อใด", opts: ["ก. สิ่งที่มีชีวิตที่เกิดตามธรรมชาติรอบตัวมนุษย์เท่านั้น", "ข. สิ่งต่าง ๆ ที่มีลักษณะทางกายภาพและชีวภาพที่อยู่รอบตัวมนุษย์ ซึ่งเกิดขึ้นโดยธรรมชาติและสิ่งที่มนุษย์ได้ทำขึ้น", "ค. ทรัพยากรธรรมชาติที่สามารถนำมาใช้ประโยชน์ทางเศรษฐกิจได้เท่านั้น", "ง. ปรากฏการณ์ทางธรรมชาติที่ส่งผลกระทบต่อการดำเนินชีวิตของมนุษย์"], ans: "ข", exp: "สิ่งแวดล้อมหมายถึงสิ่งที่มีลักษณะทางกายภาพและชีวภาพรอบตัวมนุษย์ ทั้งที่เกิดขึ้นเองตามธรรมชาติและสิ่งที่มนุษย์สร้างขึ้น" },
      { id: 122, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "สาเหตุสำคัญในประวัติศาสตร์ที่ทำให้ทรัพยากรธรรมชาติและสิ่งแวดล้อมซึ่งเป็นปัจจัยในการผลิตเสื่อมโทรมลงอย่างรวดเร็วคือข้อใด", opts: ["ก. การปฏิรูปการปกครองในยุคโบราณ", "ข. การเติบโตของเศรษฐกิจและเทคโนโลยี โดยเฉพาะการฟื้นฟูในยุคหลังสงครามโลกครั้งที่ 2", "ค. การเริ่มทำเกษตรกรรมยุคแรกของมนุษยชาติ", "ง. การเกิดภัยพิบัติทางธรรมชาติในยุคน้ำแข็ง"], ans: "ข", exp: "เกิดจากการเติบโตทางเศรษฐกิจและเทคโนโลยีอย่างก้าวกระโดดเพื่อฟื้นฟูยุคหลังสงครามโลกครั้งที่ 2" },
      { id: 123, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ข้อใดอธิบายลักษณะเฉพาะของ 'ปัญหาสิ่งแวดล้อม' ได้ถูกต้องที่สุดตามสไลด์บทเรียน", opts: ["ก. เป็นปัญหาที่เกิดขึ้นเฉพาะในเขตเมืองใหญ่เท่านั้น", "ข. เป็นปัญหาที่มีลักษณะไร้พรมแดน (Transboundary) และส่งผลกระทบต่อเนื่องยาวนาน", "ค. เป็นปัญหาที่แก้ได้อย่างสมบูรณ์ด้วยการใช้เทคโนโลยีขั้นสูงเพียงอย่างเดียว", "ง. เป็นปัญหาที่กระทบเฉพาะประชากรกลุ่มผู้มีรายได้น้อยเท่านั้น"], ans: "ข", exp: "ปัญหาสิ่งแวดล้อมเป็นปัญหาที่มีลักษณะไร้พรมแดน (Transboundary) ส่งผลกระทบข้ามเขตแดนและต่อเนื่องยาวนาน" },
      { id: 124, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "กรณีพิพาท 'หยุดเหมืองหิน คืนชีวิตให้สายน้ำกก' ถูกยกตัวอย่างในสไลด์เพื่อแสดงให้เห็นถึงประเด็นใด", opts: ["ก. การทำเหมืองแร่ที่ได้รับการยินยอมจากชุมชน", "ข. ปัญหาสิ่งแวดล้อมที่มีลักษณะข้ามพรมแดนและส่งผลกระทบต่อสายน้ำธรรมชาติ", "ค. ความสำเร็จของการจัดทำรายงาน EIA ในพื้นที่ภาคเหนือ", "ง. การใช้มาตรการทางภาษีคาร์บอนในระดับท้องถิ่น"], ans: "ข", exp: "สะท้อนปัญหาผลกระทบสิ่งแวดล้อมที่มีลักษณะข้ามพรมแดนต่อแม่น้ำธรรมชาติส่วนรวม" },
      { id: 125, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "วัตถุประสงค์ที่แท้จริงของการ 'คุ้มครองสิ่งแวดล้อม' ตามหลักความยุติธรรมด้านสิ่งแวดล้อมคือข้อใด", opts: ["ก. เพื่อยับยั้งการพัฒนาอุตสาหกรรมทุกประเภท", "ข. เพื่อรักษาผลประโยชน์และสิทธิขั้นพื้นฐานของมนุษย์ ไม่ให้ตกเป็นผู้ได้รับอันตรายจากการตักตวงธรรมชาติ", "ค. เพื่อจัดเก็บภาษีเข้าสู่รัฐให้ได้มากที่สุด", "ง. เพื่อสงวนทรัพยากรไว้ให้เอกชนรายใหญ่ใช้ประโยชน์แต่เพียงผู้เดียว"], ans: "ข", exp: "การคุ้มครองสิ่งแวดล้อมทำขึ้นเพื่อรักษาผลประโยชน์และสิทธิขั้นพื้นฐานของมนุษย์ ไม่ให้ได้รับอันตรายจากการทำลายธรรมชาติ" },
      { id: 126, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "จากข้อมูลสถิติพื้นที่ป่าไม้ของประเทศไทยช่วงปี พ.ศ. 2556 - 2568 (มูลนิธิสืบนาคะเสถียร / กรมป่าไม้) มีแนวโน้มอย่างไร", opts: ["ก. พื้นที่ป่าไม้เพิ่มขึ้นอย่างต่อเนื่องทุกปี", "ข. พื้นที่ป่าไม้คงที่ไม่มีการเปลี่ยนแปลง", "ค. พื้นที่ป่าไม้มีแนวโน้มลดลงอย่างต่อเนื่อง (จากประมาณ 102.1 ล้านไร่ เหลือประมาณ 101.6 ล้านไร่)", "ง. พื้นที่ป่าไม้เพิ่มขึ้นเท่าตัวเนื่องจากการปลูกป่าทดแทน"], ans: "ค", exp: "สถิติแสดงให้เห็นว่าพื้นที่ป่าไม้ของไทยลดลงอย่างต่อเนื่อง จากประมาณ 102.1 ล้านไร่ เหลือราว 101.6 ล้านไร่" },
      { id: 127, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "องค์การสหประชาชาติ (UN) ได้ประกาศรับรองเกี่ยวกับ 'สิทธิในสิ่งแวดล้อม' ไว้อย่างไร", opts: ["ก. สิ่งแวดล้อมเป็นเรื่องของนโยบายรัฐ ไม่ใช่สิทธิมนุษยชน", "ข. การเข้าถึงสิ่งแวดล้อมที่สะอาด ดีต่อสุขภาพ และยั่งยืน (Clean, Healthy and Sustainable Environment) เป็นสิทธิมนุษยชนสากล", "ค. สิทธิในสิ่งแวดล้อมเป็นสิทธิเฉพาะผู้ที่จ่ายภาษีสิ่งแวดล้อมเท่านั้น", "ง. สิทธิในสิ่งแวดล้อมขึ้นอยู่กับดุลยพินิจของแต่ละประเทศโดยไม่มีมาตรฐานสากล"], ans: "ข", exp: "UN ประกาศรับรองอย่างเป็นทางการว่า การอยู่ในสิ่งแวดล้อมที่สะอาด ปลอดภัย และยั่งยืน คือ สิทธิมนุษยชนสากล" },
      { id: 128, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ประเทศไทยเริ่มมีการรับรอง 'สิทธิในสิ่งแวดล้อม' ไว้ในรัฐธรรมนูญเป็นครั้งแรกตั้งแต่ปี พ.ศ. ใด", opts: ["ก. พ.ศ. 2525", "ข. พ.ศ. 2535", "ค. พ.ศ. 2540", "ง. พ.ศ. 2550"], ans: "ค", exp: "ประเทศไทยรับรองสิทธิในสิ่งแวดล้อมไว้ในรัฐธรรมนูญเป็นครั้งแรกในฉบับ พ.ศ. 2540" },
      { id: 129, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "คำกล่าวที่ว่า 'ผมต้องการอากาศบริสุทธิ์สำหรับหายใจ เมื่อจะตายก็ขออย่าให้ตายอย่างโง่ๆ อย่างบ้าๆ คือตายเพราะน้ำหรืออากาศเป็นพิษ' เป็นคำกล่าวของบุคคลสำคัญท่านใด", opts: ["ก. สืบ นาคะเสถียร", "ข. ดร.ป๋วย อึ้งภากรณ์", "ค. อ.อโณทัย มีสันเทียะ", "ง. จิตร ภูมิศักดิ์"], ans: "ข", exp: "เป็นคำกล่าวของ ดร.ป๋วย อึ้งภากรณ์ จากบทความ 'จากครรภ์มารดาถึงเชิงตะกอน'" },
      { id: 130, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "สิทธิของบุคคลและชุมชนในการมีส่วนร่วมอนุรักษ์ ฟื้นฟู บำรุง จัดการ และใช้ประโยชน์จากทรัพยากรธรรมชาติ ปรากฏอยู่ในรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 มาตราใด", opts: ["ก. มาตรา 43", "ข. มาตรา 57", "ค. มาตรา 58", "ง. มาตรา 100"], ans: "ก", exp: "สิทธิของบุคคลและชุมชนได้รับการบัญญัติไว้ในรัฐธรรมนูญ พ.ศ. 2560 มาตรา 43" },
      { id: 131, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "เมื่อเปรียบเทียบสิทธิในสิ่งแวดล้อมระหว่างรัฐธรรมนูญปี 2540/2550 กับ รัฐธรรมนูญปี 2560 ตามสไลด์บทเรียน สิทธิชุมชนในรัฐธรรมนูญ 2560 มีลักษณะอย่างไร", opts: ["ก. เข้มแข็งและมีขอบเขตชัดเจนมากขึ้นกว่าเดิม", "ข. มีลักษณะอ่อนแอลง (ม. 43) และสิทธิด้านสิ่งแวดล้อมถูกเขียนไว้อย่างกว้างๆ เป็นนามธรรม (ม. 57)", "ค. ยกเลิกสิทธิชุมชนทั้งหมดโดยสิ้นเชิง", "ง. โอนสิทธิการตัดสินใจทั้งหมดให้เป็นขององค์กรเอกชน"], ans: "ข", exp: "สิทธิชุมชนอ่อนแอลง และสิทธิด้านสิ่งแวดล้อมถูกเขียนไว้กว้างๆ เป็นนามธรรมในหมวดหน้าที่ของรัฐ" },
      { id: 132, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "การมีส่วนร่วมของประชาชนในการทำ EIA/EHIA ตามรัฐธรรมนูญ พ.ศ. 2560 (มาตรา 58) ถูกปรับเปลี่ยนอย่างไรเมื่อเทียบกับรัฐธรรมนูญปี 2550", opts: ["ก. เพิ่มอำนาจให้ประชาชนสามารถยับยั้งโครงการได้ทันที", "ข. ลดระดับการมีส่วนร่วมลงเหลือเพียง 'ตามที่กฎหมายบัญญัติ' และถูกควบคุมผ่านฝ่ายบริหารของรัฐ", "ค. กำหนดให้ต้องจัดประชาพิจารณ์อย่างน้อย 5 ครั้งต่อโครงการ", "ง. ตัดกระบวนการศึกษาผลกระทบสิ่งแวดล้อมออกทั้งหมด"], ans: "ข", exp: "ลดทอนลงเหลือเพียงให้มีส่วนร่วม 'ตามที่กฎหมายบัญญัติ' ซึ่งถูกควบคุมผ่านฝ่ายบริหารของรัฐ" },
      { id: 133, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "กฎหมายสิ่งแวดล้อมระหว่างประเทศเริ่มพัฒนารูปแบบชัดเจนจากตราสารสากลฉบับใดในปี ค.ศ. 1972", opts: ["ก. ปฏิญญาสากลว่าด้วยสิ่งแวดล้อมของมนุษย์ (Stockholm Declaration on Human Environment)", "ข. ปฏิญญาริโอว่าด้วยสิ่งแวดล้อมและการพัฒนา (Rio Declaration)", "ค. พิธีสารเกียวโต (Kyoto Protocol)", "ง. ข้อตกลงปารีส (Paris Agreement)"], ans: "ก", exp: "จุดเริ่มต้นของกฎหมายสิ่งแวดล้อมระหว่างประเทศมาจาก Stockholm Declaration on Human Environment ปี ค.ศ. 1972" },
      { id: 134, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "หลักการพื้นฐานของกฎหมายสิ่งแวดล้อมสากลข้อใด ที่เน้นการประเมินความเสี่ยง ผลดี ผลเสีย ก่อนดำเนินโครงการเพื่อป้องกันไม่ให้เกิดภยันตรายต่อสิ่งแวดล้อม (Principle of Prevention)", opts: ["ก. หลักการป้องกัน", "ข. หลักการระวังไว้ก่อน", "ค. หลักการผู้ก่อมลภาวะเป็นผู้จ่าย", "ง. หลักการชดเชยเยียวยา"], ans: "ก", exp: "Principle of Prevention คือหลักการป้องกันที่เน้นการประเมินความเสี่ยงล่วงหน้าเพื่อป้องกันภยันตรายต่อสิ่งแวดล้อม" },
      { id: 135, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "'หลักการระวังไว้ก่อน' (Precautionary Principle) ตามปฏิญญาริโอ ค.ศ. 1992 มีสาระสำคัญอย่างไร", opts: ["ก. หากไม่มีข้อพิสูจน์ทางวิทยาศาสตร์อย่างแน่ชัด ให้ดำเนินโครงการไปก่อนได้ทันที", "ข. แม้หลักฐานทางวิทยาศาสตร์จะยังไม่แน่ชัด แต่หากโครงการอาจก่อความเสียหายร้ายแรงและฟื้นฟูไม่ได้ จะใช้การขาดหลักฐานมาเป็นข้ออ้างในการไม่ปกป้องไม่ได้", "ค. ให้รอจนกว่าเกิดความเสียหายขึ้นจริง แล้วจึงค่อยหาทางแก้ไขภายหลัง", "ง. ใช้เฉพาะกับโครงการอุตสาหกรรมขนาดใหญ่ของเอกชนเท่านั้น"], ans: "ข", exp: "การขาดความแน่นอนทางวิทยาศาสตร์ไม่สามารถนำมาใช้เป็นข้ออ้างในการละเว้นการป้องกันความเสียหายร้ายแรงต่อสิ่งแวดล้อมได้" },
      { id: 136, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "หลักการ 'Polluter Pay Principle (PPP)' ในกฎหมายสิ่งแวดล้อมหมายถึงข้อใด", opts: ["ก. รัฐต้องเป็นผู้จ่ายค่าชดเชยให้แก่ผู้ก่อมลพิษ", "ข. หลักการผู้ก่อมลภาวะเป็นผู้จ่าย โดยผู้สร้างผลกระทบต้องมีหน้าที่ป้องกันและรับผิดชอบค่าใช้จ่ายในการแก้ไขเยียวยา", "ค. การให้ผู้บริโภคเป็นผู้รับภาระภาษีทั้งหมดแต่เพียงผู้เดียว", "ง. การยกเว้นค่าปรับแก่โรงงานที่ยอมรับว่าทำสิ่งแวดล้อมเสียหาย"], ans: "ข", exp: "ผู้ก่อให้เกิดมลพิษต้องมีหน้าที่ป้องกันและรับผิดชอบชดใช้ค่าเสียหายในการเยียวยาฟื้นฟู" },
      { id: 137, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "เครื่องมือทางเศรษฐศาสตร์ประเภทใดในประเทศไทย ที่กำลังจะนำมาจัดเก็บเพื่ออนุวัติการตามหลัก Polluter Pay Principle (PPP)", opts: ["ก. ภาษีมูลค่าเพิ่ม (VAT)", "ข. ภาษีคาร์บอน (Carbon Tax)", "ค. ภาษีศุลกากรสินค้าเกษตร", "ง. ภาษีมรดกสิ่งแวดล้อม"], ans: "ข", exp: "ประเทศไทยกำลังเดินหน้าเตรียมจัดเก็บภาษีคาร์บอน (Carbon Tax) ตามหลัก Polluter Pay Principle" },
      { id: 138, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "สาระสำคัญของ 'หลักการมีส่วนร่วมของประชาชน' (Public Participation) ในกฎหมายสิ่งแวดล้อมครอบคลุมเรื่องใดบ้าง", opts: ["ก. การเข้าถึงข้อมูลข่าวสาร การได้รับคำชี้แจง และการได้รับการแก้ไขเยียวยา", "ข. การบังคับให้ประชาชนลงชื่อยินยอมทุกโครงการของรัฐ", "ค. การจำกัดสิทธิการรับรู้ข้อมูลเฉพาะเจ้าหน้าที่รัฐ", "ง. การจ่ายเงินเบี้ยเลี้ยงให้แก่ผู้มาเข้าร่วมประชุมฟังคำชี้แจง"], ans: "ก", exp: "ครอบคลุม 3 ด้าน: สิทธิในการเข้าถึงข้อมูลข่าวสาร การได้รับคำชี้แจง/แสดงความคิดเห็น และการเข้าถึงการแก้ไขเยียวยา" },
      { id: 139, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ประเทศไทยเริ่มมีกฎหมายฉบับหลักในการส่งเสริมและรักษาคุณภาพสิ่งแวดล้อมเป็นการเฉพาะ คือกฎหมายใด", opts: ["ก. พระราชบัญญัติป่าไม้ พ.ศ. 2484", "ข. พระราชบัญญัติโรงงาน พ.ศ. 2535", "ค. พระราชบัญญัติส่งเสริมและรักษาคุณภาพสิ่งแวดล้อมแห่งชาติ พ.ศ. 2535", "ง. พระราชบัญญัติอุทยานแห่งชาติ พ.ศ. 2562"], ans: "ค", exp: "พ.ร.บ. ส่งเสริมและรักษาคุณภาพสิ่งแวดล้อมแห่งชาติ พ.ศ. 2535 เป็นกฎหมายแม่บทหลักด้านสิ่งแวดล้อมของไทย" },
      { id: 140, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "มาตรการสำคัญภายใต้ พ.ร.บ. ส่งเสริมและรักษาคุณภาพสิ่งแวดล้อมแห่งชาติ พ.ศ. 2535 แบ่งออกเป็น 2 กลุ่มหลัก คือกลุ่มใดบ้าง", opts: ["ก. มาตรการทางภาษี และ มาตรการทางการค้า", "ข. มาตรการป้องกัน/ควบคุม และ มาตรการแก้ไข/เยียวยา", "ค. มาตรการทางการทหาร และ มาตรการทางปกครอง", "ง. มาตรการสมัครใจ และ มาตรการรณรงค์"], ans: "ข", exp: "แบ่งเป็น 2 กลุ่มหลักคือ มาตรการป้องกัน/ควบคุม (ก่อนเริ่มโครงการ) และมาตรการแก้ไข/เยียวยา (หลังเกิดความเสียหาย)" },
      { id: 141, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "เครื่องมือใดจัดเป็น 'มาตรการป้องกัน/ควบคุม' ที่สะท้อนหลักการป้องกันและหลักการระวังไว้ก่อนตามกฎหมายไทย", opts: ["ก. การฟ้องร้องเรียกค่าเสียหายทางแพ่ง", "ข. การประเมินผลกระทบสิ่งแวดล้อม (EIA) และ การประเมินผลกระทบสิ่งแวดล้อมและสุขภาพ (EHIA)", "ค. การลงโทษจำคุกผู้บุกรุกป่าไม้", "ง. การสั่งปิดโรงงานหลังจากปล่อยน้ำเสียลงแม่น้ำแล้ว"], ans: "ข", exp: "EIA และ EHIA เป็นมาตรการเชิงป้องกันที่ทำก่อนเริ่มดำเนินโครงการเพื่อป้องกันผลกระทบ" },
      { id: 142, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ใครมีหน้าที่จัดทำรายงานการประเมินผลกระทบสิ่งแวดล้อม (EIA) เพื่อเสนอต่อเจ้าหน้าที่เพื่อขออนุมัติโครงการ", opts: ["ก. ประชาชนในชุมชนรอบโครงการ", "ข. เจ้าของโครงการ", "ค. องค์กร NGO ด้านสิ่งแวดล้อม", "ง. กรมควบคุมมลพิษ"], ans: "ข", exp: "เจ้าของโครงการมีหน้าที่จัดทำรายงาน EIA เพื่อเป็นข้อมูลเสนอให้เจ้าหน้าที่พิจารณาให้ความเห็นชอบ" },
      { id: 143, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "โครงการประเภทโรงแรมหรืออาคารอยู่อาศัย ขนาดเท่าใดขึ้นไปที่กฎหมายกำหนดให้ต้องจัดทำรายงาน EIA", opts: ["ก. 20 ห้องขึ้นไป หรือ 1,000 ตร.ม. ขึ้นไป", "ข. 50 ห้องขึ้นไป หรือ 2,000 ตร.ม. ขึ้นไป", "ค. 80 ห้องขึ้นไป หรือ 4,000 ตร.ม. ขึ้นไป", "ง. 100 ห้องขึ้นไป หรือ 10,000 ตร.ม. ขึ้นไป"], ans: "ค", exp: "เกณฑ์สำหรับโรงแรมหรืออาคารอยู่อาศัยรวมคือ ขนาด 80 ห้องขึ้นไป หรือพื้นที่ใช้สอย 4,000 ตร.ม. ขึ้นไป" },
      { id: 144, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "สถานพยาบาล หรือ โรงพยาบาล ขนาดกี่เตียงขึ้นไป ที่เข้าข่ายต้องจัดทำรายงาน EIA", opts: ["ก. 10 เตียงขึ้นไป", "ข. 30 เตียงขึ้นไป", "ค. 60 เตียงขึ้นไป", "ง. 100 เตียงขึ้นไป"], ans: "ค", exp: "สถานพยาบาลที่มีเตียงรับผู้ป่วยค้างคืนตั้งแต่ 60 เตียงขึ้นไป ต้องจัดทำรายงาน EIA" },
