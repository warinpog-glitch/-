      { id: 145, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "โรงงานผลิตเหล้าความเข้มข้น 28 ดีกรีขึ้นไป ต้องมีกำลังการผลิตเท่าใดขึ้นไปจึงจะเข้าข่ายต้องจัดทำ EIA", opts: ["ก. 10,000 ลิตร/เดือน ขึ้นไป", "ข. 20,000 ลิตร/เดือน ขึ้นไป", "ค. 40,000 ลิตร/เดือน ขึ้นไป", "ง. 100,000 ลิตร/เดือน ขึ้นไป"], ans: "ค", exp: "โรงงานสุราความเข้มข้น 28 ดีกรีขึ้นไป กำลังการผลิตตั้งแต่ 40,000 ลิตร/เดือนขึ้นไป ต้องทำ EIA" },
      { id: 146, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "โครงการประเภท 'เหมืองแร่' ชนิดใดบ้างที่กฎหมายกำหนดให้ต้องจัดทำรายงาน EIA ทุกโครงการ", opts: ["ก. เฉพาะเหมืองแร่ถ่านหินขนาดใหญ่", "ข. เหมืองแร่โลหะทุกประเภท", "ค. เฉพาะเหมืองแร่ทองคำ", "ง. เหมืองหินก่อสร้างขนาดเล็กยกเว้นไม่ต้องทำ"], ans: "ข", exp: "เหมืองแร่โลหะทุกประเภทจัดเป็นโครงการที่ต้องทำรายงาน EIA ทุกกรณี" },
      { id: 147, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ท่าเทียบเรือที่มีขนาดความยาวหรือขนาดพื้นที่เท่าใดขึ้นไป ต้องจัดทำรายงาน EIA", opts: ["ก. ความยาว 50 ม. หรือพื้นที่ 500 ตร.ม. ขึ้นไป", "ข. ความยาว 100 ม. ขึ้นไป หรือพื้นที่ท่า 1,000 ตร.ม. ขึ้นไป", "ค. ความยาว 200 ม. หรือพื้นที่ 5,000 ตร.ม. ขึ้นไป", "ง. ท่าเทียบเรือทุกขนาดโดยไม่มีข้อยกเว้น"], ans: "ข", exp: "เกณฑ์ท่าเทียบเรือต้องทำ EIA คือ ความยาวตั้งแต่ 100 เมตรขึ้นไป หรือพื้นที่ท่าเทียบเรือตั้งแต่ 1,000 ตร.ม. ขึ้นไป" },
      { id: 148, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ปัญหาความไม่ยุติธรรมด้านสิ่งแวดล้อมในกรณี 'เหมืองถ่านหินอมก๋อย' ที่สไลด์ยกตัวอย่างมาคือข้อใด", opts: ["ก. ชุมชนได้รับเงินชดเชยสูงเกินไป", "ข. คนพื้นถิ่นได้ข้อมูลไม่ครบเนื่องจากไม่เข้าใจภาษา และพบรายชื่อผู้ไม่บรรลุนิติภาวะหรือผู้เขียนหนังสือไม่ได้ในรายงาน EIA", "ค. รัฐบาลยกเลิกโครงการโดยไม่บอกกล่าวเอกชน", "ง. ไม่มีกระบวนการคัดค้านจากประชาชนเลย"], ans: "ข", exp: "คนพื้นถิ่นได้รับข้อมูลไม่ครบถ้วนจากอุปสรรคทางภาษา และพบข้อผิดพลาดในการสวมชื่อผู้สนับสนุนในรายงาน EIA" },
      { id: 149, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ในกรณีศึกษา 'นิคมอุตสาหกรรมจะนะ' สไลด์ชี้ให้เห็นถึงปัญหาการละเมิดสิทธิและการคุกคามประชาชนในรูปแบบใด", opts: ["ก. การปรับเงินประชาชนที่เข้าร่วมฟังความคิดเห็น", "ข. การเยี่ยมบ้านและโทรศัพท์ก่อกวนก่อนการรับฟังความคิดเห็น รวมถึงแกนนำประท้วงถูกแจ้งข้อหา พ.ร.ก.ฉุกเฉิน", "ค. การยึดที่ดินเอกชนโดยไม่จ่ายค่าเวนคืน", "ง. การปิดห้ามเข้าพื้นที่ชายหาดทั้งหมด"], ans: "ข", exp: "มีการเยี่ยมบ้านและโทรศัพท์ก่อกวนก่อนการรับฟังความคิดเห็น รวมถึงการแจ้งข้อหาดำเนินคดีต่อแกนนำคัดค้าน" },
      { id: 150, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "มาตรการทางแพ่งในการแก้ไข/เยียวยาปัญหาสิ่งแวดล้อมตาม พ.ร.บ. สิ่งแวดล้อมฯ กำหนดความรับผิดของผู้ก่อให้เกิดมลพิษไว้อย่างไร", opts: ["ก. รับผิดชดใช้ค่าเสียหายเฉพาะกรณีที่ทำโดยเจตนาเท่านั้น", "ข. ต้องรับผิดทางแพ่งต่อผู้ได้รับความเสียหายแก่ชีวิต ร่างกาย สุขภาพ อนามัย หรือทรัพย์สิน", "ค. ไม่ต้องรับผิดชอบหากจ่ายค่าปรับทางอาญาแล้ว", "ง. ให้รัฐบาลเป็นผู้ชดใช้ค่าเสียหายแทนผู้ก่อมลพิษทั้งหมด"], ans: "ข", exp: "ผู้ก่อมลพิษต้องรับผิดทางแพ่งชดใช้ค่าเสียหายแก่ผู้ได้รับผลกระทบต่อชีวิต ร่างกาย สุขภาพ หรือทรัพย์สิน" },
      { id: 151, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "หากการทำลายสิ่งแวดล้อมส่งผลให้ 'ทรัพยากรธรรมชาติของรัฐ' ถูกทำลาย สูญหาย หรือเสียหาย ผู้ก่อมลพิษมีหน้าที่ตามกฎหมายอย่างไร", opts: ["ก. ปลูกต้นไม้ชดเชยจำนวน 100 ต้น", "ข. ต้องชดใช้ค่าเสียหายให้แก่รัฐตามมูลค่าทรัพยากรที่ถูกทำลาย", "ค. พ้นจากความรับผิดชอบหากส่งมอบอุปกรณ์บำบัดน้ำเสีย", "ง. ไม่ต้องรับผิดชอบเพราะทรัพยากรธรรมชาติไม่มีเจ้าของ"], ans: "ข", exp: "ผู้ก่อมลพิษมีหน้าที่ต้องชดใช้ค่าสินไหมทดแทนให้แก่รัฐตามมูลค่าความเสียหายของทรัพยากรธรรมชาติ" },
      { id: 152, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "การทำลายสิ่งแวดล้อมที่ส่งผลกระทบต่อความสงบเรียบร้อยของรัฐ จัดเป็นความผิดทางอาญาประเภทใดตามสไลด์บทเรียน", opts: ["ก. อาชญากรรมทางเศรษฐกิจ (Economic Crime)", "ข. อาชญากรรมเกี่ยวกับสิ่งแวดล้อม (Ecology Crime)", "ค. อาชญากรรมคอมพิวเตอร์ (Cyber Crime)", "ง. ลหุโทษทั่วไป (Minor Offense)"], ans: "ข", exp: "การกระทำผิดทางอาญาที่ทำลายสิ่งแวดล้อมและกระทบความสงบเรียบร้อย เรียกว่า Ecology Crime" },
      { id: 153, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ตัวอย่างการกระทำใดบ้างที่จัดเป็นความผิดอาญาในกลุ่มอาชญากรรมเกี่ยวกับสิ่งแวดล้อม (Ecology Crime)", opts: ["ก. การแพร่กระจายมลพิษ, การบุกรุกที่ดินรัฐ, การทำลายทรัพยากรธรรมชาติ, การทำให้เกิดสิ่งปฏิกูล", "ข. การไม่เข้าร่วมประชุมฟังความคิดเห็น EIA", "ค. การขายสินค้าบรรจุภัณฑ์พลาสติกในตลาดสด", "ง. การเดินประท้วงเรียกร้องให้รัฐจัดเก็บภาษีคาร์บอน"], ans: "ก", exp: "ความผิดอาญาด้านสิ่งแวดล้อม เช่น การปล่อยมลพิษเกินเกณฑ์ การบุกรุกป่าสงวน และการลักลอบทิ้งกากของเสียอันตราย" },
      { id: 154, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ตามรัฐธรรมนูญ พ.ศ. 2560 (มาตรา 57 และ 58) หากรัฐหรือผู้ที่ได้รับอนุมัติจากรัฐ จะดำเนินโครงการที่อาจมีผลกระทบต่อสิ่งแวดล้อมและสุขภาพ รัฐมีหน้าที่ต้องทำสิ่งใดก่อน", opts: ["ก. ประกาศเพิ่มภาษีในพื้นที่นั้นทันที", "ข. ดำเนินการให้มีการศึกษาและประเมินผลกระทบต่อคุณภาพสิ่งแวดล้อมและสุขภาพของประชาชนและชุมชน", "ค. จ่ายเงินชดเชยล่วงหน้าให้แก่ประชาชนทุกคนในจังหวัด", "ง. ย้ายประชาชนออกนอกพื้นที่โครงการโดยไม่ต้องรับฟังความเห็น"], ans: "ข", exp: "รัฐต้องดำเนินการให้มีการศึกษาและประเมินผลกระทบต่อคุณภาพสิ่งแวดล้อมและสุขภาพ (EHIA) พร้อมรับฟังความคิดเห็นก่อน" },
      { id: 155, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ในประเด็นร่าง 'พ.ร.บ. อากาศสะอาด' สไลด์บทเรียนได้ตั้งคำถามสำคัญในทางกฎหมายสิ่งแวดล้อมไว้อย่างไร", opts: ["ก. 'ควรยกเลิกการใช้รถยนต์ไฟฟ้าหรือไม่?'", "ข. 'ผู้ก่อมลพิษ จะเป็นผู้จ่ายได้ไหม?'", "ค. 'ใครจะเป็นผู้ปลูกป่าทดแทน?'", "ง. 'รัฐบาลควรแจกหน้ากากอนามัยฟรีหรือไม่?'"], ans: "ข", exp: "ตั้งคำถามว่า 'ผู้ก่อมลพิษ จะเป็นผู้จ่ายได้ไหม?' เพื่อสะท้อนการนำหลัก Polluter Pay Principle มาปรับใช้จริง" },
      { id: 156, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "เหตุใดการจัดการปัญหาสิ่งแวดล้อมจึงจำเป็นต้องมี 'มาตรการบังคับและมาตรการจูงใจ' ควบคุมพฤติกรรมมนุษย์ ทั้งก่อน ระหว่าง และหลังการดำเนินกิจการ", opts: ["ก. เพราะปัญหาสิ่งแวดล้อมแก้ไขได้ยากหากปล่อยให้ขึ้นอยู่กับความสมัครใจเพียงอย่างเดียว และผลกระทบสามารถส่งผลต่อเนื่องยาวนาน", "ข. เพื่อหารายได้เข้าสู่กรมควบคุมมลพิษ", "ค. เพื่อให้เอกชนขนาดใหญ่ปฏิเสธการทำ EIA", "ง. เพื่อความสะดวกในการออกใบอนุญาตสร้างโรงงาน"], ans: "ก", exp: "เพราะปัญหาสิ่งแวดล้อมข้ามพรมแดนและผลกระทบยาวนาน จึงไม่อาจปล่อยให้ขึ้นอยู่กับความสมัครใจ จำเป็นต้องมีกฎหมายบังคับ" },
      { id: 157, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "สิทธิของประชาชนในการเข้าถึงข้อมูลข่าวสารและการโต้แย้งโครงการของรัฐเกี่ยวกับสิ่งแวดล้อม สอดคล้องกับหลักการใดในสไลด์บทเรียน", opts: ["ก. Principle of Prevention", "ข. Public Participation (หลักการมีส่วนร่วมของประชาชน)", "ค. Polluter Pay Principle", "ง. Precautionary Principle"], ans: "ข", exp: "หลัก Public Participation มุ่งรับรองสิทธิการรับรู้ การแสดงความคิดเห็น และการตรวจสอบโต้แย้งของภาคประชาชน" },
      { id: 158, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "สาระสำคัญที่สุดที่เป็น 'Key Takeaway' ข้อแรกของเอกสารประกอบการบรรยายฉบับนี้คือเรื่องใด", opts: ["ก. มนุษย์ทุกคนมีสิทธิที่จะมีชีวิตอยู่ในสิ่งแวดล้อมที่ดีและมีคุณภาพ มีความเป็นอยู่ที่ดีและมีศักดิ์ศรี", "ข. รัฐมีสิทธิสมบูรณ์ในการใช้ประโยชน์จากทรัพยากรธรรมชาติโดยไม่ต้องรับฟังประชาชน", "ค. การพัฒนาเศรษฐกิจต้องมาก่อนการอนุรักษ์สิ่งแวดล้อมเสมอ", "ง. โครงการเอกชนทุกประเภทได้รับยกเว้นไม่ต้องทำรายงาน EHIA"], ans: "ก", exp: "Key Takeaway ข้อแรกคือ มนุษย์ทุกคนมีสิทธิที่จะมีชีวิตอยู่ในสิ่งแวดล้อมที่ดี สะอาด มีคุณภาพชีวิต และมีศักดิ์ศรี" },
      { id: 159, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ตัวอย่างสถานที่ท่องเที่ยวทางธรรมชาติในจังหวัดนครราชสีมา ที่สไลด์ยกมาแสดงการปิดปรับปรุงเพื่อฟื้นฟูธรรมชาติและบริหารจัดการพื้นที่คือสถานที่ใด", opts: ["ก. ผาเก็บตะวัน วังน้ำเขียว", "ข. น้ำผุดเขาใหญ่", "ค. เขื่อนลำตะคอง", "ง. น้ำตกตาดกวด"], ans: "ข", exp: "น้ำผุดเขาใหญ่ ประกาศปิดปรับปรุงเป็นเวลา 2 ปี เพื่อพลิกโฉมและฟื้นฟูธรรมชาติ" },
      { id: 160, cat: "ความยุติธรรมกับสิ่งแวดล้อม", q: "ข้อสรุปเกี่ยวกับบทบาทของมนุษย์กับความยุติธรรมด้านสิ่งแวดล้อมคือข้อใด", opts: ["ก. มนุษย์สามารถตักตวงทรัพยากรได้ไม่จำกัดโดยไม่ส่งผลกระทบต่อตนเอง", "ข. กฎหมายและมาตรการสิ่งแวดล้อมเป็นเครื่องมือสำคัญในการสร้างความยุติธรรม ปกป้องสิทธิมนุษยชน และนำไปสู่การพัฒนาอย่างยั่งยืน", "ค. การคุ้มครองสิ่งแวดล้อมเป็นหน้าที่ของนักวิทยาศาสตร์และองค์กร NGO เท่านั้น", "ง. รายงาน EIA เป็นเพียงเอกสารประกอบทางราชการที่ไม่มีผลบังคับใช้จริง"], ans: "ข", exp: "กฎหมายและมาตรการสิ่งแวดล้อมเป็นกลไกสำคัญในการผดุงความยุติธรรม คุ้มครองสิทธิมนุษยชน และนำไปสู่ความยั่งยืน" },

      // หมวดที่ 5: Self-sufficiency in the age of consumerism (161-200)
      { id: 161, cat: "เศรษฐกิจพอเพียง", q: "เอกสารประกอบการเรียนเรื่อง Self-sufficiency in the age of consumerism บรรยายโดยอาจารย์ท่านใด", opts: ["ก. ดร.ศิริลักษณ์ ชุมเขียว", "ข. อ.อโณทัย มีสันเทียะ", "ค. ดร.สุวิตรา วิจัยคำมาร์ต (อ.แอ๋น)", "ง. ดร.ป๋วย อึ้งภากรณ์"], ans: "ค", exp: "ผู้บรรยายคือ Dr. Sumittra Vichaikammart (อ.แอ๋น)" },
      { id: 162, cat: "เศรษฐกิจพอเพียง", q: "ข้อใด ไม่ใช่ ผลการเรียนรู้ที่คาดหวัง (Learning Outcomes) ของบทเรียนนี้", opts: ["ก. อธิบายความสัมพันธ์ระหว่างพฤติกรรมการบริโภคกับการใช้ทรัพยากรธรรมชาติ", "ข. วิเคราะห์ผลกระทบทางสังคมและสิ่งแวดล้อมจากการบริโภคประจำวัน", "ค. อธิบายและประยุกต์ใช้ปรัชญาเศรษฐกิจพอเพียงเพื่อวางแผนวิถีชีวิตที่ยั่งยืน", "ง. คำนวณอัตราผลตอบแทนจากการลงทุนในตลาดหุ้นอุตสาหกรรมสีเขียว"], ans: "ง", exp: "บทเรียนมุ่งเน้นความเข้าใจเรื่องการบริโภค ผลกระทบต่อทรัพยากร และเศรษฐกิจพอเพียง ไม่เกี่ยวข้องกับการคำนวณหุ้น" },
      { id: 163, cat: "เศรษฐกิจพอเพียง", q: "สไลด์บทเรียนสะท้อนแนวคิดเกี่ยวกับ 'การบริโภค' (Consumption) ในชีวิตประจำวันไว้อย่างไร", opts: ["ก. การบริโภคจะเกิดขึ้นเฉพาะเวลาที่เราไปเดินห้างสรรพสินค้าเท่านั้น", "ข. การบริโภคเกิดขึ้นตลอดเวลาและทุกสถานที่ ตั้งแต่เราตื่นนอนจนถึงเข้านอน (Consumption is everywhere)", "ค. การบริโภคเกิดขึ้นเฉพาะเมื่อมีการจ่ายเงินสดเท่านั้น", "ง. การบริโภคเป็นกิจกรรมที่เกิดขึ้นเฉพาะในวัยทำงาน"], ans: "ข", exp: "'CONSUMPTION IS EVERYWHERE' เราบริโภคและใช้ทรัพยากรอยู่ตลอดเวลาในชีวิตประจำวัน" },
      { id: 164, cat: "เศรษฐกิจพอเพียง", q: "ข้อใดอธิบายความแตกต่างระหว่าง 'การบริโภค (Consumption)' กับ 'การช้อปปิ้ง (Shopping)' ได้ถูกต้องตามสไลด์บทเรียน", opts: ["ก. การบริโภคและการช้อปปิ้งมีความหมายเหมือนกันทุกประการ", "ข. การช้อปปิ้งคือการใช้ทรัพยากร ส่วนการบริโภคคือการจ่ายเงินซื้อสินค้า", "ค. การบริโภคไม่ได้หมายถึงการช้อปปิ้งเพียงอย่างเดียว (Consumption ≠ Shopping) แต่รวมถึงการใช้ทรัพยากร เช่น น้ำ ไฟฟ้า หรือพลังงาน", "ง. การช้อปปิ้งเกิดขึ้นเฉพาะทางออนไลน์ ส่วนการบริโภคเกิดขึ้นเฉพาะในหน้าร้าน"], ans: "ค", exp: "Consumption ≠ Shopping เพราะการบริโภคครอบคลุมถึงการใช้ทรัพยากรต่างๆ เช่น น้ำ ไฟฟ้า พลังงาน โดยไม่จำเป็นต้องไปซื้อของ" },
      { id: 165, cat: "เศรษฐกิจพอเพียง", q: "กิจกรรมในข้อใดจัดเป็นการบริโภค (Consumption) โดยที่ไม่ใช่การช้อปปิ้ง (Shopping)", opts: ["ก. การซื้อเสื้อผ้าใหม่ในห้างสรรพสินค้า", "ข. การสั่งซื้อสมาร์ทโฟนรุ่นใหม่ทางออนไลน์", "ค. การเปิดพัดลม/เครื่องปรับอากาศ และการชาร์จแบตเตอรี่โทรศัพท์มือถือ", "ง. การเลือกซื้อเครื่องสำอางที่เคาน์เตอร์แบรนด์"], ans: "ค", exp: "การเปิดแอร์ พัดลม หรือชาร์จแบตเตอรี่ เป็นการบริโภคทรัพยากรพลังงานโดยตรงโดยไม่ต้องมีการซื้อสินค้า" },
      { id: 166, cat: "เศรษฐกิจพอเพียง", q: "ข้อใด ไม่ใช่ หนึ่งใน 6 เหตุผลหลักที่สไลด์ระบุว่า 'ทำไมเราถึงบริโภคหรือซื้อสิ่งของ' (Why do we consume?)", opts: ["ก. Need (ความจำเป็น) และ Want (ความอยาก)", "ข. Convenience (ความสะดวกสบาย) และ Social Influence (อิทธิพลทางสังคม)", "ค. Emotion (อารมณ์) และ Promotion (การส่งเสริมการขาย)", "ง. Genetics (พันธุกรรม) และ Climate (สภาพอากาศ)"], ans: "ง", exp: "6 เหตุผลหลักได้แก่ Need, Want, Convenience, Social Influence, Emotion และ Promotion" },
      { id: 167, cat: "เศรษฐกิจพอเพียง", q: "กิจกรรม 'การซื้อสมาร์ทโฟนเครื่องใหม่ เพียงเพราะใช้เครื่องเดิมมา 2 ปีแล้ว' จัดอยู่ในกลุ่มใดตามกิจกรรมในสไลด์", opts: ["ก. NEED (ความจำเป็น)", "ข. WANT (ความอยาก)", "ค. BASIC RIGHT (สิทธิขั้นพื้นฐาน)", "ง. REASONABLE (ความมีเหตุผล)"], ans: "ข", exp: "เครื่องเดิมยังใช้งานได้ การเปลี่ยนเครื่องใหม่ตามระยะเวลาจึงจัดอยู่ในกลุ่มความอยากได้ (WANT)" },
      { id: 168, cat: "เศรษฐกิจพอเพียง", q: "กิจกรรม 'การดื่มกาแฟแก้วที่สองของวัน ทั้งที่ดื่มแก้วแรกไปแล้วเมื่อเช้า' จัดอยู่ในกลุ่มใด", opts: ["ก. NEED (ความจำเป็น)", "ข. WANT (ความอยาก)", "ค. SELF-IMMUNITY (การมีภูมิคุ้มกัน)", "ง. MODERATION (ความพอประมาณ)"], ans: "ข", exp: "การดื่มกาแฟแก้วที่สองจัดอยู่ในกลุ่มความอยากได้ส่วนเกิน (WANT)" },
      { id: 169, cat: "เศรษฐกิจพอเพียง", q: "กิจกรรม 'การซื้อรองเท้าคู่ใหม่ แม้คู่เดิมยังใช้งานได้ดี แต่รองเท้ารุ่นใหม่กำลังเป็นเทรนด์นิยม' จัดอยู่ในกลุ่มใด", opts: ["ก. NEED (ความจำเป็น)", "ข. WANT (ความอยาก)", "ค. KNOWLEDGE (ความรู้)", "ง. MORALITY (คุณธรรม)"], ans: "ข", exp: "การซื้อสินค้าตามกระแสนิยมหรือแฟชั่นจัดอยู่ในกลุ่มความอยากได้ (WANT)" },
      { id: 170, cat: "เศรษฐกิจพอเพียง", q: "กิจกรรม 'การซื้อเสื้อ 3 ตัวเพราะร้านค้าจัดโปรโมชั่นลดราคา 50% ทั้งที่จริงต้องการเพียง 1 ตัว' จัดเป็นพฤติกรรมการบริโภคที่ขับเคลื่อนด้วยปัจจัยใดหลักๆ", opts: ["ก. NEED และ REASONABLENESS", "ข. WANT และ PROMOTION", "ค. SELF-IMMUNITY และ SAFETY", "ง. MORALITY และ TRADITION"], ans: "ข", exp: "พฤติกรรมนี้ขับเคลื่อนด้วยความอยากได้ (WANT) ร่วมกับสิ่งกระตุ้นทางการตลาด (PROMOTION)" },
      { id: 171, cat: "เศรษฐกิจพอเพียง", q: "นิยามของคำว่า 'บริโภคนิยม (Consumerism)' ตามสไลด์บทเรียนคือข้อใด", opts: ["ก. แนวคิดที่ส่งเสริมให้ประชาชนปลูกผักสวนครัวเพื่อกินเองภายในครอบครัว", "ข. แนวคิดหรือวิถีชีวิตที่ให้ความสำคัญกับการบริโภคสินค้าและบริการในระดับสูง จนการบริโภคกลายเป็นส่วนหนึ่งของค่านิยมและวิถีชีวิต", "ค. ระบบเศรษฐกิจที่ห้ามไม่ให้มีการนำเข้าสินค้าจากต่างประเทศ", "ง. การเลือกซื้อเฉพาะสินค้าที่เป็นมิตรต่อสิ่งแวดล้อมเท่านั้น"], ans: "ข", exp: "บริโภคนิยมคือวิถีชีวิตที่ให้ความสำคัญกับการบริโภคสินค้าและบริการในระดับสูงเกินความจำเป็นจนกลายเป็นวัฒนธรรม" },
      { id: 172, cat: "เศรษฐกิจพอเพียง", q: "แผนภาพ 'THE INVISIBLE INFLUENCERS' ในสไลด์บทเรียน ต้องการสื่อสารประเด็นสำคัญใดเกี่ยวกับตัวเรา (ME)", opts: ["ก. พฤติกรรมการบริโภคของมนุษย์เกิดจากความต้องการอิสระของตนเอง 100% โดยไม่เกี่ยวกับใคร", "ข. พฤติกรรมการบริโภคไม่ได้เกิดจากความปรารถนาส่วนตัวเท่านั้น แต่เชื่อมโยงและถูกอิทธิพลรอบข้างกำหนด เช่น สื่อ สังคม ครอบครัว เพื่อน และโฆษณา", "ค. มนุษย์ทุกคนถูกควบคุมด้วยอัลกอริทึมของสมาร์ทโฟนเพียงอย่างเดียว", "ง. ปัจจัยทางพันธุกรรมเป็นตัวกำหนดแบรนด์สินค้าที่เราเลือกซื้อ"], ans: "ข", exp: "พฤติกรรมเราถูกหล่อหลอมและโน้มน้าวด้วยอิทธิพลทางสังคม สื่อ โฆษณา และคนรอบข้าง" },
      { id: 173, cat: "เศรษฐกิจพอเพียง", q: "สไลด์บทเรียนเสนอให้เราปรับเปลี่ยนมุมมองทางความคิด (Shift of Perspective) จากคำถามเดิมไปสู่คำถามใหม่ตามข้อใด", opts: ["ก. เปลี่ยนจาก 'ราคาเท่าไหร่?' เป็น 'ลดราคาได้กี่บาท?'", "ข. เปลี่ยนจาก 'ฉันกำลังซื้ออะไร?' (What am I buying?) เป็น 'ฉันกำลังใช้ทรัพยากรอะไรอยู่?' (What resources am I using?)", "ค. เปลี่ยนจาก 'ซื้อที่ไหน?' เป็น 'ผ่อนได้กี่เดือน?'", "ง. เปลี่ยนจาก 'ใช้นานแค่ไหน?' เป็น 'แบรนด์อะไรกำลังฮิต?'"], ans: "ข", exp: "เปลี่ยนจากการมองแค่สิ่งของที่ซื้อ ไปสู่การตระหนักว่าเรากำลังดึงทรัพยากรธรรมชาติอะไรมาใช้บ้าง" },
      { id: 174, cat: "เศรษฐกิจพอเพียง", q: "เมื่อเราบริโภค 'อาหาร' ทรัพยากรเบื้องหลังที่เราดึงมาใช้ตามสไลด์บทเรียน ไม่ได้ รวมข้อใด", opts: ["ก. Water (น้ำ)", "ข. Energy (พลังงาน)", "ค. Raw material (วัตถุดิบ) และ Packaging (บรรจุภัณฑ์)", "ง. Rare Earth Minerals (แร่ธาตุหายาก)"], ans: "ง", exp: "แร่ธาตุหายาก (Rare Earth Minerals) เป็นทรัพยากรเบื้องหลังของการผลิตสมาร์ทโฟน ไม่ใช่อาหาร" },
      { id: 175, cat: "เศรษฐกิจพอเพียง", q: "ทรัพยากรเบื้องหลังที่ถูกนำมาใช้ในกระบวนการบริโภค 'เสื้อผ้า' ตามสไลด์บทเรียน ประกอบด้วยอะไรบ้าง", opts: ["ก. น้ำ, พลังงาน, วัตถุดิบ, การขนส่ง (Transportation)", "ข. พื้นที่ท่องเที่ยว, ค่าตั๋วเครื่องบิน, เชื้อเพลิง", "ค. สัญญาณอินเทอร์เน็ต, ระบบแอปพลิเคชัน, ซิลิคอน", "ง. ถ่านหิน, แก๊สธรรมชาติ, แร่ทองคำ"], ans: "ก", exp: "การผลิตเสื้อผ้าต้องใช้น้ำ พลังงาน วัตถุดิบเส้นใย และการขนส่ง" },
      { id: 176, cat: "เศรษฐกิจพอเพียง", q: "ในการใช้อุปกรณ์อย่าง 'สมาร์ทโฟน' ทรัพยากรสำคัญที่สไลด์ระบุไว้คือข้อใด", opts: ["ก. Minerals (แร่ธาตุ), Energy (พลังงาน), Water (น้ำ), Technology (เทคโนโลยี)", "ข. Packaging, Transportation, Food, Area", "ค. Coal, Petroleum, Forest, Soil", "ง. Air, Solar, Wind, Biomass"], ans: "ก", exp: "สมาร์ทโฟนต้องพึ่งพาแร่ธาตุ (Minerals), พลังงาน (Energy), น้ำ (Water) และเทคโนโลยีขั้นสูง" },
      { id: 177, cat: "เศรษฐกิจพอเพียง", q: "ขั้นตอนของ 'วงจรชีวิตผลิตภัณฑ์' (Product Life Cycle) ตามสไลด์หน้า 23 เรียงลำดับถูกต้องอย่างไร", opts: ["ก. Consumption → Resource → Production → Distribution → Disposal", "ข. Resource → Production → Distribution → Consumption → Disposal", "ค. Production → Resource → Consumption → Distribution → Disposal", "ง. Distribution → Production → Resource → Disposal → Consumption"], ans: "ข", exp: "เริ่มจาก วัตถุดิบ (Resource) → การผลิต (Production) → การกระจายสินค้า (Distribution) → การบริโภค (Consumption) → การทิ้ง/กำจัด (Disposal)" },
      { id: 178, cat: "เศรษฐกิจพอเพียง", q: "กรอบความคิด 'TO BUY OR NOT TO BUY?' ในสไลด์บทเรียน ให้เราตั้งคำถามกับตนเองในประเด็นใดบ้างก่อนตัดสินใจ", opts: ["ก. ฉันบริโภคอะไร? ทำไมฉันถึงบริโภค? ฉันบริโภคมากน้อยเท่าใด? และส่งผลกระทบอย่างไร?", "ข. ซื้อแล้วจะเอาไปอวดใครได้บ้าง? มีโปรโมชั่นแถมอะไรบ้าง?", "ค. ร้านไหนขายถูกที่สุด? มีบริการส่งฟรีหรือไม่?", "ง. เพื่อนในกลุ่มซื้อกันหรือยัง? ดาราคนไหนเป็นพรีเซนเตอร์?"], ans: "ก", exp: "คำถาม 4 มิติ: What am I consuming?, Why do I consume?, How much do I consume?, What impact does it have?" },
      { id: 179, cat: "เศรษฐกิจพอเพียง", q: "ความเข้าใจผิดประการแรกเกี่ยวกับ 'ความพอเพียง (Sufficiency)' ที่สไลด์ร่วมท้าทาย (CHALLENGE THE MISCONCEPTION) คือข้อใด", opts: ["ก. Sufficiency ≠ Poverty (ความพอเพียง ไม่เท่ากับ ความยากจน)", "ข. Sufficiency ≠ Technology (ความพอเพียง ไม่เท่ากับ เทคโนโลยี)", "ค. Sufficiency ≠ Education (ความพอเพียง ไม่เท่ากับ การศึกษา)", "ง. Sufficiency ≠ Investment (ความพอเพียง ไม่เท่ากับ การลงทุน)"], ans: "ก", exp: "ความพอเพียงไม่ได้หมายถึงความยากจน (Sufficiency ≠ Poverty) แต่คือการดำเนินชีวิตบนพื้นฐานของความสมเหตุสมผล" },
      { id: 180, cat: "เศรษฐกิจพอเพียง", q: "สไลด์บทเรียนท้าทายความเข้าใจผิดเกี่ยวกับความพอเพียงว่า 'Sufficiency ≠ No Buying' หมายความว่าอย่างไร", opts: ["ก. คนพอเพียงต้องห้ามซื้อสินค้าทุกชนิดตลอดชีวิต", "ข. ความพอเพียงไม่ได้หมายความว่าห้ามซื้อของเลย แต่เป็นการซื้ออย่างรู้ความพอดีและมีเหตุผล", "ค. ความพอเพียงสนับสนุนให้ซื้อของเฉพาะช่วงจัดโปรโมชั่นเท่านั้น", "ง. ความพอเพียงอนุญาตให้ซื้อสินค้าแบรนด์เนมได้โดยไม่ต้องคิด"], ans: "ข", exp: "ความพอเพียงไม่ได้ห้ามซื้อของ แต่ให้ซื้ออย่างรู้ความพอดี มีสติ และคุ้มค่า" },
      { id: 181, cat: "เศรษฐกิจพอเพียง", q: "ข้อความ 'Sufficiency ≠ Live a hard life' ในสไลด์บทเรียน ต้องการอธิบายว่าอย่างไร", opts: ["ก. ความพอเพียงคือการทรมานตนเองให้ลำบาก", "ข. ความพอเพียงไม่ได้หมายความว่าต้องบังคับตนเองให้ดำเนินชีวิตอย่างยากลำบากหรือเข็ญใจ", "ค. ความพอเพียงสนับสนุนให้ใช้ชีวิตแบบสมถะโดยไม่สวมรองเท้า", "ง. ความพอเพียงเหมาะสำหรับคนในชนบทเท่านั้น"], ans: "ข", exp: "ความพอเพียงไม่ใช่การทรมานหรือบังคับตนเองให้ใช้ชีวิตลำบากเข็ญใจ แต่คือการใช้ชีวิตให้พอเหมาะพอดี" },
      { id: 182, cat: "เศรษฐกิจพอเพียง", q: "การท้าทายความเข้าใจผิดที่ว่า 'Sufficiency ≠ Forbidden to be happy' ต้องการสื่อถึงสิ่งใด", opts: ["ก. ความพอเพียงไม่ได้ห้ามให้มนุษย์มีความสุข ความพอเพียงสร้างความสุขที่ยั่งยืนบนความพอดี", "ข. ความพอเพียงสั่งห้ามการแสวงหาความสุขทุกรูปแบบ", "ค. ความสุขเกิดจากการซื้อของปริมาณมากที่สุดเท่าที่จะทำได้", "ง. ความสุขเป็นเรื่องผิดศีลธรรมในระบบเศรษฐกิจพอเพียง"], ans: "ก", exp: "ความพอเพียงไม่ได้ห้ามความสุข แต่สร้างความสุขที่ยั่งยืน สบายใจ และไม่ก่อภาระหนี้สิน" },
      { id: 183, cat: "เศรษฐกิจพอเพียง", q: "โครงสร้างของ 'ปรัชญาเศรษฐกิจพอเพียง' (Sufficiency Economy Philosophy) ตามสไลด์บทเรียน ประกอบด้วยองค์ประกอบหลักตามข้อใด", opts: ["ก. 2 ห่วง 3 เงื่อนไข", "ข. 3 ห่วง 2 เงื่อนไข (3 Rings and 2 Conditions Framework)", "ค. 4 ห่วง 4 เงื่อนไข", "ง. 5 ห่วง 1 เงื่อนไข"], ans: "ข", exp: "โครงสร้างหลักปรัชญาเศรษฐกิจพอเพียงประกอบด้วย 3 ห่วง 2 เงื่อนไข" },
      { id: 184, cat: "เศรษฐกิจพอเพียง", q: "ห่วงที่ 1 'ความพอประมาณ' (MODERATION) ตามสไลด์บทเรียนหมายถึงแนวทางปฏิบัติอย่างไร", opts: ["ก. การใช้อย่างประหยัดที่สุดจนร่างกายขาดสารอาหาร", "ข. การดำเนินชีวิตบนทางสายกลาง เพลิดเพลินกับความพอดีและเหมาะสม (Enjoy simple, appropriate means / The Middle Path)", "ค. การตัดสินใจโดยใช้อารมณ์ความรู้สึกเป็นหลัก", "ง. การสะสมสินค้าไว้ในคลังให้ได้มากที่สุด"], ans: "ข", exp: "ความพอประมาณคือการเดินสายกลาง (The Middle Path) พอเหมาะพอควรกับสภาพความเป็นอยู่" },
      { id: 185, cat: "เศรษฐกิจพอเพียง", q: "ห่วงที่ 2 'ความมีเหตุผล' (REASONABLENESS) เน้นการตัดสินใจในลักษณะใด และต้องตอบคำถามชุดใด", opts: ["ก. ทำตามกระแสนิยม / ซื้อเพราะดาราโฆษณา", "ข. การตัดสินใจอย่างมีตรรกะ (Making logical decisions) โดยพิจารณาคำถาม WHY?, NEED?, BENEFIT?, CONSEQUENCE?, ALTERNATIVE?", "ค. การเลือกซื้อของราคาแพงที่สุดเสมอเพื่อความคุ้มค่า", "ง. การตัดสินใจโดยอ้างอิงจากโชคชะตา"], ans: "ข", exp: "การตัดสินใจอย่างมีตรรกะและเหตุผล คำนึงถึงประโยชน์ ความจำเป็น และผลลัพธ์ที่จะตามมา" },
      { id: 186, cat: "เศรษฐกิจพอเพียง", q: "ห่วงที่ 3 'การมีภูมิคุ้มกันในตัวที่ดี' (SELF-IMMUNITY / RESILIENCE) ตามสไลด์บทเรียน คือการเตรียมความพร้อมรับมือกับสิ่งใด", opts: ["ก. ความไม่แน่นอน (Uncertainty), ความเสี่ยง (Risk), การเปลี่ยนแปลง (Change) และเหตุการณ์ไม่คาดฝัน (Unexpected event)", "ข. โรคติดเชื้อทางเดินหายใจเพียงอย่างเดียว", "ค. การถูกปฏิเสธบัตรเครดิต", "ง. การแข่งขันกีฬาในระดับมหาวิทยาลัย"], ans: "ก", exp: "การมีภูมิคุ้มกันคือการเตรียมพร้อมรับมือกับความไม่แน่นอน ความเสี่ยง และความเปลี่ยนแปลงต่างๆ" },
      { id: 187, cat: "เศรษฐกิจพอเพียง", q: "'เงื่อนไขความรู้' (KNOWLEDGE CONDITION) ที่เป็นฐานรองรับ 3 ห่วง ประกอบด้วยหลักการสำคัญ 3 ประการคือข้อใด", opts: ["ก. KNOWLEDGE (ความรู้), PRUDENCE (ความรอบคอบ), CAUTION (ความระมัดระวัง)", "ข. HONESTY (ความซื่อสัตย์), INTEGRITY (ความมีจริยธรรม), DILIGENCE (ความขยัน)", "ค. MODERATION, REASONABLENESS, RESILIENCE", "ง. SPEED, POWER, PROFIT"], ans: "ก", exp: "เงื่อนไขความรู้ประกอบด้วย KNOWLEDGE, PRUDENCE และ CAUTION" },
      { id: 188, cat: "เศรษฐกิจพอเพียง", q: "'เงื่อนไขคุณธรรม' (MORALITY CONDITION) ที่เป็นฐานรองรับปรัชญาเศรษฐกิจพอเพียง ครอบคลุมคุณลักษณะใด", opts: ["ก. KNOWLEDGE, PRUDENCE, CAUTION", "ข. HONESTY (ความซื่อสัตย์สุจริต), INTEGRITY (ความมีจริยธรรมยึดมั่นในความถูกต้อง), DILIGENCE (ความเพียรพยายาม)", "ค. WEALTH, FAME, POWER", "ง. PASSION, EMOTION, FASHION"], ans: "ข", exp: "เงื่อนไขคุณธรรมครอบคลุม ความซื่อสัตย์สุจริต (Honesty), ความมีจริยธรรม (Integrity) และความเพียรพยายาม (Diligence)" },
      { id: 189, cat: "เศรษฐกิจพอเพียง", q: "ในกรอบการตัดสินใจบริโภคอย่างมีสติ (MINDFUL CONSUMPTION FRAMEWORK) ขั้นตอนที่ 1 'ARE YOU BEING MODERATE?' ให้พิจารณาประเด็นใด", opts: ["ก. HOW MUCH? ประเมินปริมาณ หลีกเลี่ยงความส่วนเกินและขยะ ซื้อเฉพาะเท่าที่จำเป็น", "ข. WHO IS AFFECTED? ใครได้รับผลกระทบทางสังคม", "ค. WHAT IF? ประเมินความเสี่ยงทางการเงิน", "ง. WHAT DO I KNOW? ตรวจสอบคุณค่าทางโภชนาการ"], ans: "ก", exp: "พิจารณา 'HOW MUCH?' ประเมินปริมาณ หลีกเลี่ยงความส่วนเกินและขยะ ซื้อเฉพาะเท่าที่จำเป็น" },
      { id: 190, cat: "เศรษฐกิจพอเพียง", q: "ขั้นตอนที่ 2 'IS IT REASONABLE?' ใน Mindful Consumption Framework เน้นการวิเคราะห์สิ่งใด", opts: ["ก. WHY? วิเคราะห์แรงจูงใจที่แท้จริง แยกแยะระหว่าง Need vs Want และหลีกเลี่ยงการซื้อตามอารมณ์", "ข. HOW MUCH? ประเมินขนาดบรรจุภัณฑ์", "ค. WHO IS AFFECTED? ตรวจสอบการใช้แรงงานทาส", "ง. WHAT IF? ตรวจสอบโปรโมชั่นประกันสินค้า"], ans: "ก", exp: "พิจารณา 'WHY?' วิเคราะห์แรงจูงใจที่แท้จริง แยกแยะระหว่าง Need vs Want" },
      { id: 191, cat: "เศรษฐกิจพอเพียง", q: "ขั้นตอนที่ 3 'HAVE YOU CONSIDERED CONSEQUENCES?' ของ Mindful Consumption Framework ตั้งคำถามว่าอย่างไร", opts: ["ก. 'HOW MUCH?'", "ข. 'WHY?'", "ค. 'WHAT IF?' ประเมินความเสี่ยง เตรียมรับมือผลกระทบทางลบ ด้านการเงินและสุขภาพ", "ง. 'WHO IS AFFECTED?'"], ans: "ค", exp: "ตั้งคำถาม 'WHAT IF?' ประเมินความเสี่ยงและเตรียมรับมือผลกระทบทางลบด้านการเงินและสุขภาพ" },
      { id: 192, cat: "เศรษฐกิจพอเพียง", q: "ในขั้นตอนที่ 4 'DO WE HAVE ENOUGH KNOWLEDGE?' มีคำแนะนำให้ผู้บริโภคเท่าทันปรากฏการณ์ใดในการเลือกซื้อสินค้า", opts: ["ก. Recognize Greenwashing (การเท่าทันการฟอกเขียว/การสร้างภาพว่าเป็นมิตรต่อสิ่งแวดล้อม)", "ข. Recognize Oversleeping (การนอนหลับเกินเวลา)", "ค. Recognize Overheating (การเครื่องร้อนเกินไป)", "ง. Recognize Overclocking (การเร่งความเร็วซีพียู)"], ans: "ก", exp: "ผู้บริโภคต้องรู้เท่าทันการฟอกเขียว (Greenwashing) ที่โฆษณาเกินจริงว่าเป็นมิตรต่อสิ่งแวดล้อม" },
      { id: 193, cat: "เศรษฐกิจพอเพียง", q: "ขั้นตอนที่ 5 'ARE WE RESPONSIBLE TO OTHERS?' ใน Mindful Consumption Framework ให้ตั้งคำถามสำคัญว่าอย่างไร", opts: ["ก. 'HOW MUCH?'", "ข. 'WHO IS AFFECTED?' ใครบ้างที่ได้รับผลกระทบ ทั้งด้านแรงงานเชิงจริยธรรม สิ่งแวดล้อม และสังคมชุมชน", "ค. 'WHAT IF?'", "ง. 'WHY?'"], ans: "ข", exp: "ตั้งคำถาม 'WHO IS AFFECTED?' โดยคำนึงถึงผลกระทบต่อสิ่งแวดล้อม สังคม และแรงงานที่เป็นธรรม" },
      { id: 194, cat: "เศรษฐกิจพอเพียง", q: "จากตัวอย่างการประเมินการตัดสินใจซื้อสมาร์ทโฟนราคา 48,900 บาท ในสไลด์หน้า 36 ประเด็น 'Moderation' ตั้งคำถามว่าอย่างไร", opts: ["ก. สมาร์ทโฟนเครื่องนี้เหมาะกับสถานะทางการเงินของคุณหรือไม่?", "ข. คุณประโยชน์ที่เพิ่มขึ้นจำเป็นสำหรับเราจริงๆ หรือไม่?", "ค. การซื้อนี้จะส่งผลกระทบต่อเงินสำรองหรือค่าใช้จ่ายอื่นหรือไม่?", "ง. โทรศัพท์เครื่องเดิมจะถูกนำไปจัดการอย่างไร?"], ans: "ก", exp: "Moderation ตั้งคำถามว่า 'Is it suitable for your financial situation?' หรือเหมาะกับสถานะการเงินหรือไม่" },
      { id: 195, cat: "เศรษฐกิจพอเพียง", q: "ในกรณีตัวอย่างซื้อสมาร์ทโฟนราคา 48,900 บาท ประเด็น 'Reasonableness (ความมีเหตุผล)' ตั้งคำถามประเมินว่าอย่างไร", opts: ["ก. สีของเครื่องสวยถูกใจหรือไม่?", "ข. ประโยชน์หรือฟังก์ชันที่เพิ่มขึ้นมานั้นมีความจำเป็นสำหรับเราหรือไม่? (Are increased benefits necessary for us?)", "ค. ร้านค้ามีของแถมเป็นเคสและฟิล์มกระจกหรือไม่?", "ง. เพื่อนในกลุ่มใช้รุ่นนี้กี่คน?"], ans: "ข", exp: "Reasonableness ตั้งคำถามว่า 'Are increased benefits necessary for us?' หรือประโยชน์ที่เพิ่มขึ้นจำเป็นจริงหรือไม่" },
      { id: 196, cat: "เศรษฐกิจพอเพียง", q: "การประเมินด้าน 'Immunity (ภูมิคุ้มกัน)' สำหรับกรณีตัวอย่างซื้อสมาร์ทโฟน 48,900 บาท พิจารณาจากสิ่งใด", opts: ["ก. โทรศัพท์มีระบบกันน้ำและกันกระแทกหรือไม่", "ข. การซื้อครั้งนี้จะส่งผลกระทบต่อเงินสำรอง หรือค่าใช้จ่ายจำเป็นอื่นหรือไม่? (Will the purchase impact reserves or other expenses?)", "ค. มีการแถมประกันหน้าจอแตก 1 ปีหรือไม่", "ง. เครื่องสามารถปล่อยสัญญาณ Wi-Fi ได้แรงแค่ไหน"], ans: "ข", exp: "Immunity พิจารณาว่า 'Will the purchase impact reserves or other expenses?' หรือกระทบเงินสำรองฉุกเฉินหรือไม่" },
      { id: 197, cat: "เศรษฐกิจพอเพียง", q: "ในกรณีตัวอย่างสมาร์ทโฟน 48,900 บาท การประเมินด้าน 'Morality (คุณธรรม)' ให้ความสำคัญกับคำถามในข้อใด", opts: ["ก. โทรศัพท์เครื่องเดิมจะถูกนำไปจัดการอย่างไร? (How will the original phone be handled?)", "ข. บริษัทผู้ผลิตจ่ายภาษีถูกต้องหรือไม่", "ค. คนขายพูดจาไพเราะหรือไม่", "ง. เราได้นำเงินส่วนตัวมาซื้อใช่หรือไม่"], ans: "ก", exp: "Morality ตั้งคำถามว่า 'How will the original phone be handled?' เครื่องเดิมจะถูกนำไปจัดการอย่างไรเพื่อไม่ให้กลายเป็นขยะอิเล็กทรอนิกส์" },
      { id: 198, cat: "เศรษฐกิจพอเพียง", q: "ข้อความสรุปปรัชญาความพอเพียงในหน้าสุดท้ายของสไลด์ (หน้า 37) นิยามความพอเพียงไว้อย่างน่าประทับใจว่าอย่างไร", opts: ["ก. 'ความพอเพียงคือการไม่มีหนี้สินเลยแม้แต่บาทเดียว'", "ข. 'ความพอเพียงไม่ใช่การมีให้น้อยที่สุด แต่คือการรู้ว่าอะไรคือ ความพอดี (Just right) และการตัดสินใจอย่างมีเหตุผล'", "ค. 'ความพอเพียงคือการเลิกใช้เทคโนโลยีสมาร์ทโฟนแล้วกลับไปใช้จดหมาย'", "ง. 'ความพอเพียงคือการเก็บออมเงินร้อยละ 90 ของรายได้'"], ans: "ข", exp: "'Sufficiency is not about having as little as possible, but knowing what is just right and making rational choices'" },
      { id: 199, cat: "เศรษฐกิจพอเพียง", q: "การวิเคราะห์ขยะและผลกระทบที่เกิดหลังจากการทิ้งสินค้า (Disposal) สอดคล้องกับขั้นตอนใดของ Product Life Cycle", opts: ["ก. ขั้นตอนที่ 1 Resource", "ข. ขั้นตอนที่ 2 Production", "ค. ขั้นตอนที่ 3 Distribution", "ง. ขั้นตอนที่ 5 Disposal"], ans: "ง", exp: "สอดคล้องกับขั้นตอนที่ 5 Disposal (การกำจัด/การทิ้ง) ซึ่งส่งผลกระทบต่อสิ่งแวดล้อมโดยตรง" },
      { id: 200, cat: "เศรษฐกิจพอเพียง", q: "เป้าหมายสูงสุดของการเรียนรู้บทเรียน 'Self-sufficiency in the age of consumerism' คือข้อใด", opts: ["ก. เพื่อให้ผู้เรียนสามารถตำหนิพฤติกรรมการซื้อของผู้อื่นได้", "ข. เพื่อให้ผู้เรียนสามารถสะท้อนความคิดและกำหนดแนวทางปรับเปลี่ยนพฤติกรรมการบริโภคของตนเองให้มีความรับผิดชอบต่อสังคมและสิ่งแวดล้อมอย่างยั่งยืน", "ค. เพื่อให้ผู้เรียนเลิกใช้บริการขนส่งสินค้าออนไลน์ทั้งหมด", "ง. เพื่อให้ผู้เรียนจดจำชื่อแบรนด์สินค้าที่เป็นมิตรต่อสิ่งแวดล้อมได้มากที่สุด"], ans: "ข", exp: "เป้าหมายสูงสุดคือ เพื่อให้ผู้เรียนเกิดการใคร่ครวญ (Self-reflection) และปรับเปลี่ยนพฤติกรรมการบริโภคของตนเองให้มีความรับผิดชอบต่อสังคมและสิ่งแวดล้อมอย่างยั่งยืน" }
    ];

    const STORAGE_KEY_ANS = 'manso_quiz_answers_v1';
    const STORAGE_KEY_IDX = 'manso_quiz_idx_v1';

    let currentQuestionIdx = 0;
    let currentFilter = 'all';
    let userAnswers = {};

    // ฟังก์ชันโหลดข้อมูลที่เคยตอบค้างไว้
    function loadSavedProgress() {
      try {
        const savedAns = localStorage.getItem(STORAGE_KEY_ANS);
        if (savedAns) {
          const parsed = JSON.parse(savedAns);
          if (parsed && typeof parsed === 'object') userAnswers = parsed;
        }

        const savedIdx = localStorage.getItem(STORAGE_KEY_IDX);
        if (savedIdx !== null) {
          const parsedIdx = parseInt(savedIdx, 10);
          if (!isNaN(parsedIdx) && parsedIdx >= 0 && parsedIdx < questions.length) {
            currentQuestionIdx = parsedIdx;
          }
        }
      } catch (e) {
        console.warn('LocalStorage unavailable, running in-memory.');
      }
    }

    // ฟังก์ชันบันทึกข้อมูลแบบเรียลไทม์
    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY_ANS, JSON.stringify(userAnswers));
        localStorage.setItem(STORAGE_KEY_IDX, currentQuestionIdx.toString());
      } catch (e) {}
    }

    function initQuiz() {
      loadSavedProgress();
      buildGrid();
      displayQuestion(currentQuestionIdx);
    }

    function buildGrid() {
      const grid = document.getElementById('gridNav');
      if (!grid) return;
      grid.innerHTML = '';

      questions.forEach((q, idx) => {
        if (currentFilter !== 'all' && q.cat !== currentFilter) return;

        const cell = document.createElement('div');
        cell.className = 'grid-item' + (idx === currentQuestionIdx ? ' active' : '');
        cell.id = `cell_${idx}`;
        cell.innerText = idx + 1;

        if (userAnswers[idx] !== undefined) {
          cell.classList.add(userAnswers[idx] === q.ans ? 'correct' : 'wrong');
        }

        cell.onclick = () => displayQuestion(idx);
        grid.appendChild(cell);
      });
    }

    function switchCategory(cat, btnElement) {
      currentFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        const fallback = document.getElementById('btn_cat_all');
        if (fallback) fallback.classList.add('active');
      }

      buildGrid();

      const targetIdx = questions.findIndex(q => cat === 'all' || q.cat === cat);
      if (targetIdx !== -1) displayQuestion(targetIdx);
    }

    function displayQuestion(idx) {
      if (idx < 0 || idx >= questions.length) idx = 0;
      currentQuestionIdx = idx;
      saveProgress();

      const q = questions[idx];
      if (!q) return;

      const idxText = document.getElementById('currentIdxText');
      if (idxText) idxText.innerText = idx + 1;

      const catBadge = document.getElementById('categoryBadge');
      if (catBadge) catBadge.innerText = (q.cat || 'หมวดหมู่').replace(/_/g, ' ');

      const titleEl = document.getElementById('questionTitle');
      if (titleEl) titleEl.innerText = `${q.id}. ${q.q}`;

      document.querySelectorAll('.grid-item').forEach(el => el.classList.remove('active'));
      const activeCell = document.getElementById(`cell_${idx}`);
      if (activeCell) activeCell.classList.add('active');

      const container = document.getElementById('optionsContainer');
      if (!container) return;
      container.innerHTML = '';
      const isAnswered = userAnswers[idx] !== undefined;

      (q.opts || []).forEach(opt => {
        const letter = opt.trim().substring(0, 1);
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;

        if (isAnswered) {
          btn.disabled = true;
          if (letter === q.ans) {
            btn.classList.add('selected-correct');
          } else if (letter === userAnswers[idx]) {
            btn.classList.add('selected-wrong');
          }
        } else {
          btn.onclick = () => handleChoice(letter, q.ans);
        }

        container.appendChild(btn);
      });

      const expBox = document.getElementById('explanationBox');
      if (expBox) {
        if (isAnswered) {
          const isCorrect = userAnswers[idx] === q.ans;
          expBox.className = `explanation-box ${isCorrect ? 'correct' : 'wrong'}`;
          expBox.innerHTML = `<strong>เฉลย: ข้อ ${q.ans}</strong><br>${q.exp}`;
          expBox.style.display = 'block';
        } else {
          expBox.style.display = 'none';
        }
      }

      calculateScore();
    }

    function handleChoice(selected, correct) {
      userAnswers[currentQuestionIdx] = selected;
      saveProgress();

      const cell = document.getElementById(`cell_${currentQuestionIdx}`);
      if (cell) {
        cell.classList.add(selected === correct ? 'correct' : 'wrong');
      }
      displayQuestion(currentQuestionIdx);
    }

    function changeQuestion(delta) {
      const nextIdx = currentQuestionIdx + delta;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        displayQuestion(nextIdx);
      }
    }

    function calculateScore() {
      let score = 0;
      Object.keys(userAnswers).forEach(idx => {
        if (questions[idx] && userAnswers[idx] === questions[idx].ans) score++;
      });
      const scoreEl = document.getElementById('scoreNumText');
      if (scoreEl) scoreEl.innerText = score;
    }

    function resetProgress() {
      if (confirm('ต้องการล้างคำตอบที่บันทึกไว้ทั้งหมดเพื่อเริ่มทำใหม่ใช่หรือไม่?')) {
        userAnswers = {};
        currentQuestionIdx = 0;
        try {
          localStorage.removeItem(STORAGE_KEY_ANS);
          localStorage.removeItem(STORAGE_KEY_IDX);
        } catch (e) {}
        buildGrid();
        displayQuestion(0);
      }
    }

    // เริ่มทำงานเมื่อ DOM พร้อม
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initQuiz);
    } else {
      initQuiz();
    }
  </script>
